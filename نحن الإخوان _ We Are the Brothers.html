about:{t:{en:"Overview",ar:"نبذة عامة"},p:[{en:"The Muslim Brotherhood describes itself as an Islamic group that aims at political, social and economic reform, and at reform of all aspects of life from a comprehensive Islamic perspective, in Egypt and the countries where it is present.",ar:"تصف جماعة الإخوان المسلمين نفسها بأنها جماعة إسلامية تهدف إلى الإصلاح السياسي والاجتماعي والاقتصادي وإصلاح جميع جوانب الحياة من منظور إسلامي شامل، في مصر والدول التي تنتشر فيها."},{en:"Its motto, as it states it, is that Allah is its objective, the Prophet its leader, the Quran its law, jihad its way, and dying in the way of Allah its highest hope. Most of this site comes from the group’s official sites (ikhwan.site and ikhwanonline.com) and is presented as its own account; the Imam al-Banna page also uses outside sources, each labeled.",ar:"شعارها كما تعلنه: الله غايتنا، والرسول قدوتنا، والقرآن دستورنا، والجهاد سبيلنا، والموت في سبيل الله أسمى أمانينا. ومعظم ما في هذا الموقع مأخوذ من موقعي الجماعة الرسميين ومعروض بوصفه روايتها، وصفحة الإمام البنا تستعين أيضاً بمصادر خارجية موسومة."}]},
banna:{t:{en:"Imam Hasan al-Banna",ar:"الإمام حسن البنا"},src:{en: "Sources: the group’s own sites (ikhwan.site and ikhwanonline.com) and outside encyclopedias and historians (Wikipedia, Britannica, Encyclopedia.com, Qantara’s review of Gudrun Krämer’s biography, and Jadaliyya). Every section is tagged with which it comes from. Outside sources disagree with the group on some points, and this page shows both.", ar: "المصادر: موقعا الجماعة (ikhwan.site وikhwanonline.com) وموسوعات ومؤرخون من خارجها (ويكيبيديا ودائرة المعارف البريطانية وEncyclopedia.com ومراجعة قنطرة لسيرة غودرون كرامر وجدلية). كل قسم موسوم بمصدره. وتختلف المصادر الخارجية مع الجماعة في بعض النقاط، وتعرض هذه الصفحة الجانبين."},items:[
[{en: "In brief", ar: "باختصار"}, {en: "Hassan Ahmed Abd al-Rahman al-Banna (1906–1949) was an Egyptian schoolteacher and imam who founded the Muslim Brotherhood in March 1928 and led it as its first General Guide until he was shot in Cairo on 12 February 1949, at the age of 42. Encyclopedias describe him as one of the most influential Islamist thinkers and organisers of the twentieth century. The group calls him the martyred Imam. This page follows his life from birth to death, and each section is marked as coming either from the group’s own account or from encyclopedias and historians.", ar: "حسن أحمد عبد الرحمن البنا (1906–1949) معلم ومدرس مصري وإمام أسس جماعة الإخوان المسلمين في مارس 1928 وقادها مرشداً عاماً أول حتى أُطلق عليه الرصاص في القاهرة في 12 فبراير 1949 وهو في الثانية والأربعين. تصفه الموسوعات بأنه من أكثر المفكرين والمنظمين الإسلاميين تأثيراً في القرن العشرين، وتسميه الجماعة الإمام الشهيد. تتبع هذه الصفحة حياته من الولادة حتى الوفاة، وكل قسم فيها موسوم بأنه من رواية الجماعة أو من الموسوعات والمؤرخين."}, "o"],
[{en: "1 · Egypt before his birth", ar: "١ · مصر قبل مولده"}, {en: "The group’s biography begins with the society he was born into. It says that from about 1914 to 1928 Egypt’s social life was deteriorating, as Western customs spread: bars, nightclubs, lotteries, cinemas, and magazines and papers that promoted the new trend. It says young people were tempted to rebel against everything old, and the rich competed to import luxuries and send their children to study in Europe.", ar: "تبدأ سيرة الجماعة عنه بالمجتمع الذي وُلد فيه. تقول إن الحياة الاجتماعية في مصر من نحو 1914 إلى 1928 كانت تتدهور مع انتشار العادات الغربية: الحانات والملاهي واليانصيب ودور السينما، وصحف ومجلات روّجت للتيار الجديد. وتذكر أن الشباب أُغري بالتمرد على كل قديم، وأن الأغنياء تنافسوا في استجلاب أدوات الترف من أوروبا وإرسال أبنائهم للتعلم في الغرب."}, "g"],
[{en: "The countryside and the law", ar: "الريف والقانون"}, {en: "It adds that peasants were the group least touched by these trends but were at the mercy of big landowners, with about 0.5 percent of the people holding the agricultural wealth. It also says French-style law spread through the mixed courts and the Sharia courts were limited to personal-status matters. The group presents this as the situation in which it, and its founder, appeared.", ar: "وتضيف أن الفلاحين أقل الفئات تأثراً بهذه التيارات لكنهم كانوا نهباً لكبار الملاك الذين يمتلكون الثروة الزراعية وتبلغ نسبتهم نحو 0.5% من السكان. وتذكر أن القوانين الفرنسية توسع الأخذ بها عبر المحاكم المختلطة وأن المحاكم الشرعية اقتصر دورها على الأحوال الشخصية. وتقدم الجماعة ذلك بوصفه الظرف الذي ظهرت فيه هي ومؤسسها."}, "g"],
[{en: "2 · Birth and family", ar: "٢ · المولد والأسرة"}, {en: "Hassan Ahmad Abdel Rahman al-Banna was born on 25 Sha’ban 1324 AH, which the group gives as 14 October 1906, in the town of Mahmoudiya in Beheira governorate, north-west of Cairo, on a branch of the Nile. He was the eldest son and had eight siblings. The group’s biography gives his lifespan as 1906 to 1949 and calls him the martyred Imam.", ar: "وُلد حسن أحمد عبد الرحمن البنا في 25 شعبان 1324هـ الموافق بحسب الجماعة 14 أكتوبر 1906م في مدينة المحمودية بمحافظة البحيرة شمال غرب القاهرة على أحد فرعي النيل. كان الابن الأكبر وله ثمانية إخوة. وتحدد سيرة الجماعة عمره بين 1906 و1949 وتسميه الإمام الشهيد."}, "g"],
[{en: "Outside accounts: birth and family background", ar: "في المصادر الخارجية: المولد والخلفية الأسرية"}, {en: "Encyclopedias agree on 14 October 1906 in Mahmudiyya, a Nile Delta town in Beheira governorate. They describe a lower-middle-class family that was not part of the elite but was respected locally: his father, Sheikh Ahmad al-Banna al-Sa’ati, was a Hanbali imam, muezzin and mosque teacher, and the family owned some property. His father’s work arranging the hadith of Imam Ahmad ibn Hanbal brought him links with scholars that later helped his son in Cairo. During the economic crisis of the 1920s the family could not keep up its property and moved to Cairo in 1924.", ar: "تتفق الموسوعات على أنه وُلد في 14 أكتوبر 1906 في المحمودية، وهي بلدة في دلتا النيل بمحافظة البحيرة. وتصف أسرة من الطبقة الوسطى الدنيا ليست من النخبة لكنها محترمة محلياً: فوالده الشيخ أحمد البنا الساعاتي إمام حنبلي ومؤذن ومدرس في المسجد، وكانت الأسرة تملك بعض العقارات. وقد أكسبه عمله في ترتيب أحاديث الإمام أحمد بن حنبل صلات بالعلماء أفادت ابنه لاحقاً في القاهرة. وخلال الأزمة الاقتصادية في العشرينيات عجزت الأسرة عن الحفاظ على ممتلكاتها فانتقلت إلى القاهرة عام 1924."}, "o"],
[{en: "3 · His father", ar: "٣ · والده"}, {en: "His father, Ahmad Abdel Rahman al-Banna, is described by the group as a practising scholar known for piety, seriousness, honesty and good relations with people. He studied literature under Sheikh Muhammad Abduh and worked on the science of hadith, writing works including “Al-Fath al-Rabbani”, an arrangement of the Musnad of Imam Ahmad. He was also the village’s marriage registrar, its imam and the preacher of its mosque, and made his living binding books and repairing watches, which earned him the nickname “al-Sa’ati”, the watchmaker.", ar: "يصف موقع الجماعة والده أحمد عبد الرحمن البنا بأنه من العلماء العاملين المعروفين بالتقوى والجدية والصدق وحسن الصلة بالناس. درس الأدب على الشيخ محمد عبده واشتغل بعلوم السنة وله مصنفات منها «الفتح الرباني لترتيب مسند الإمام أحمد». وكان مأذون القرية وإمامها وخطيب مسجدها، ويحترف تجليد الكتب وإصلاح الساعات فلُقّب بـ«الساعاتي»."}, "g"],
[{en: "4 · Childhood and the Quran", ar: "٤ · الطفولة والقرآن"}, {en: "His father sent him early to the kuttab to memorise the Quran, as preparation for al-Azhar, which Muslims then saw as the hope of preserving Islam. At eight he joined the religious school “al-Irshad”, and in his memoirs he praised his teacher Sheikh Muhammad Zahran, whose way of teaching, he wrote, showed him that emotional sharing and spiritual response between pupil and teacher is the best way to build a sound character.", ar: "وجّهه والده إلى الكُتّاب مبكراً ليحفظ القرآن تمهيداً لالتحاقه بالأزهر الذي كان المسلمون يرونه أمل الحفاظ على الإسلام. وفي الثامنة التحق بمدرسة «الإرشاد» الدينية، وأثنى في مذكراته على معلمه الشيخ محمد زهران الذي أدرك من أسلوبه أن المشاركة العاطفية والتجاوب الروحي بين التلميذ وأستاذه أمثل السبل لبناء الشخصية السوية."}, "g"],
[{en: "The move to preparatory school", ar: "الانتقال إلى المدرسة الإعدادية"}, {en: "When that teacher left and others without the same spiritual glow took over, the boy decided at twelve to move to the preparatory school, which taught language, religion, property and finance law and a little horticulture. He had memorised half the Quran, and when his father objected he promised to finish memorising it, which the group says he did.", ar: "وعندما ترك الشيخ المدرسة وتولاها من لا يملك الإشراق الروحي نفسه فكر وهو في الثانية عشرة في الانتقال إلى المدرسة الإعدادية التي كانت تدرس علوم اللغة والدين والقوانين العقارية والمالية ونبذة عن فلاحة البساتين. وكان قد حفظ نصف القرآن، وحين عارض والده وعده بإتمام حفظه، وتقول الجماعة إنه صدق في وعده."}, "g"],
[{en: "5 · A disciplined boy", ar: "٥ · صبي منظّم"}, {en: "The group describes how he split his day: lessons at the preparatory school by day, learning the watch trade after school, studying after the night prayer until sleep, and memorising the day’s portion of the Quran after the dawn prayer. It presents this as proof of an organised boy who guarded his time from the start.", ar: "تصف الجماعة تقسيمه يومه: الدرس نهاراً بالمدرسة الإعدادية، وتعلم صناعة الساعات بعد الدراسة، ومذاكرة دروسه بعد العشاء حتى النوم، وحفظ حصة القرآن اليومية بعد صلاة الصبح. وتعدّ ذلك دليلاً على طفل منظم حريص على وقته منذ بداية نشأته."}, "g"],
[{en: "Outside accounts: Sufi roots and early influences", ar: "في المصادر الخارجية: الجذور الصوفية والتأثيرات الأولى"}, {en: "Besides the Quran, hadith, basic law and Arabic, a reference entry says he joined the Hasafiyya Sufi order in his teens, and Gudrun Krämer’s biography stresses these Sufi roots, noting the Sufi preference for simplicity, spontaneity and rituals with song, which kept Sufis close to ordinary people. He studied at the village mosque with Sheikh Zahran and privately with his father, and was moved by Rashid Rida’s magazine Al-Manar. Other accounts list Ibn Taymiyya, al-Ghazali and Muhammad Abduh among those who influenced him.", ar: "إلى جانب القرآن والحديث ومبادئ الفقه واللغة العربية، يذكر مرجع موسوعي أنه انتسب في سن المراهقة إلى الطريقة الحصافية الصوفية، وتؤكد سيرة غودرون كرامر هذه الجذور الصوفية، مشيرة إلى ميل الصوفية إلى البساطة والعفوية والشعائر المصحوبة بالإنشاد مما أبقاهم قريبين من عامة الناس. درس في مسجد القرية على الشيخ زهران وتلقى دروساً خاصة من والده، وتأثر بمجلة المنار لرشيد رضا. وتذكر مصادر أخرى ابن تيمية والغزالي ومحمد عبده بين من أثّروا فيه."}, "o"],
[{en: "6 · First acts of reform", ar: "٦ · أولى مبادرات الإصلاح"}, {en: "The group says that from early boyhood he felt a desire to reform along Islamic lines, a revolt against every form of vice and laxity. As a preparatory student he saw a nude wooden figure hung on the mast of a sailing boat on the Mahmoudiya canal, went to the police officer to protest, and the officer forced the boat’s owner to take it down at once.", ar: "تقول الجماعة إنه منذ صباه المبكر نمت فيه الرغبة في الإصلاح على نهج الإسلام، ثورةً على مظاهر الفسق والتحلل. وبينما كان تلميذاً في الإعدادية رأى تمثالاً خشبياً عارياً معلقاً على سارية سفينة شراعية على ترعة المحمودية، فذهب إلى ضابط النقطة محتجاً، فأمر الضابط صاحب السفينة بإنزاله فوراً."}, "g"],
[{en: "Outside accounts: 1919, a boy in the revolution", ar: "في المصادر الخارجية: 1919 فتى في الثورة"}, {en: "According to his memoirs as cited by Wikipedia, his first contact with Egyptian nationalist politics came in the 1919 revolution, when he was thirteen: he joined demonstrations in Damanhur, published political pamphlets and founded youth reform societies. Britannica adds that at twelve he joined a society for moral behaviour, an early sign of the religious concern that marked his whole life.", ar: "بحسب مذكراته كما أوردتها ويكيبيديا، جاء أول احتكاك له بالسياسة الوطنية المصرية في ثورة 1919 وكان في الثالثة عشرة: شارك في مظاهرات في دمنهور ونشر منشورات سياسية وأسس جمعيات شبابية إصلاحية. وتضيف دائرة المعارف البريطانية أنه انضم في الثانية عشرة إلى جمعية للسلوك الأخلاقي، وهي علامة مبكرة على الاهتمام الديني الذي ميّز حياته كلها."}, "o"],
[{en: "7 · A leader among classmates", ar: "٧ · قائد بين زملائه"}, {en: "At Al-Rashad preparatory school he stood out among his classmates, and when the “Society of Moral Ethics” was formed they chose him as chairman of its board. Not satisfied, he and keen friends formed a society outside the school, the “Society for the Prevention of the Forbidden”, which sent letters to those reported to be committing sins or neglecting worship.", ar: "في مدرسة الرشاد الإعدادية تميز بين زملائه، وعندما تألفت «جمعية الأخلاق الأدبية» اختاروه رئيساً لمجلس إدارتها. ولم ترضِ الجمعية المدرسية فضوله وزملاءه المتحمسين، فألفوا جمعية خارج المدرسة سموها «جمعية منع المحرمات»، كانت ترسل الخطابات لمن يبلغها أنهم يرتكبون الآثام أو لا يحسنون أداء العبادات."}, "g"],
[{en: "8 · Teachers’ school in Damanhur", ar: "٨ · مدرسة المعلمين بدمنهور"}, {en: "After he entered the teachers’ school in Damanhur, the idea developed further. He founded the “Hasafiyya Charitable Society”, which worked in two fields: spreading virtuous morals and resisting widespread forbidden things, and resisting the missionary missions that, the group says, preached Christianity under the cover of medical care, embroidery lessons and housing for students.", ar: "بعد التحاقه بمدرسة المعلمين بدمنهور تطورت الفكرة في ذهنه، فألف «الجمعية الحصافية الخيرية» التي عملت في حقلين: نشر الدعوة إلى الأخلاق الفاضلة ومقاومة المنكرات والمحرمات الفاشية، ومقاومة الإرساليات التبشيرية التي تقول الجماعة إنها كانت تبشر بالمسيحية في ظل التطبيب وتعليم التطريز وإيواء الطلبة."}, "g"],
[{en: "9 · Cairo and Dar al-Ulum", ar: "٩ · القاهرة ودار العلوم"}, {en: "He then moved to Cairo and joined the Higher Dar al-Ulum school. He joined the “Makarim al-Akhlaq al-Islamiyya” society, the only one then in Cairo, attended its lectures, and followed the sermons given in mosques by leading scholars.", ar: "ثم انتقل إلى القاهرة والتحق بمدرسة دار العلوم العليا، وانتسب إلى جمعية «مكارم الأخلاق الإسلامية» وهي الوحيدة في القاهرة آنذاك، وواظب على سماع محاضراتها وتتبع المواعظ التي كانت تُلقى في المساجد على يد نخبة من العلماء العاملين."}, "g"],
[{en: "Outside accounts: Cairo, 1923–1927", ar: "في المصادر الخارجية: القاهرة 1923–1927"}, {en: "He enrolled at Dar al-Ulum, a teacher-training college, in 1923. In the city he noticed what he saw as young educated Egyptians drifting from an Islamic way of life, and he had little respect for the liberal political class. He visited the Salafiyya bookshop run by Muhibb al-Din al-Khatib, attended Rashid Rida’s lectures, wrote more than fifteen articles for the journal Al-Fath linked to the Young Men’s Muslim Association, and corresponded with Rida. Rida’s idea of a state governed by Sharia and a return to the model of the Prophet’s time later guided his work.", ar: "التحق بدار العلوم، وهي كلية لإعداد المعلمين، عام 1923. وفي المدينة لاحظ ما رآه ابتعاداً للشباب المتعلم عن نمط الحياة الإسلامي، ولم يكن يحترم الطبقة السياسية الليبرالية. كان يتردد على المكتبة السلفية التي يديرها محب الدين الخطيب، ويحضر محاضرات رشيد رضا، وكتب أكثر من خمسة عشر مقالاً في مجلة الفتح المرتبطة بجمعية الشبان المسلمين، وراسل رضا. وقد وجّهت فكرة رضا عن دولة تحكمها الشريعة والعودة إلى نموذج عهد النبي عمله لاحقاً."}, "o"],
[{en: "10 · Preaching in the coffeehouses", ar: "١٠ · الدعوة في المقاهي"}, {en: "What he saw of decline in Cairo convinced him that mosques alone could not carry Islam’s teaching to people, since those who do not attend mosques need preaching more. The group calls this his innovative mind. He proposed to Dar al-Ulum classmates and some Azharite friends that they go out and preach in coffeehouses and public gatherings. They were shocked at first, agreed to try, and the experiment succeeded, so a branch took on preaching in the countryside and cities in the summer holidays, giving them confidence and a good name among ordinary people.", ar: "جعله ما رآه في القاهرة من مظاهر التحلل يرى أن المساجد وحدها لا تكفي لإيصال تعاليم الإسلام، فالجمهور الذي لا يرتاد المساجد أشد حاجة إلى الموعظة، وتسمي الجماعة ذلك عقليته المبتكرة. اقترح على زملائه بدار العلوم وبعض أصدقائه الأزهريين أن يخرجوا للدعوة في المقاهي والمجتمعات العامة، فاستنكروا الفكرة أول الأمر ثم اتفقوا على التجربة، وأظهرت نجاحاً عظيماً، فتخصصت شعبة لنشر الدعوة في الريف والمدن أثناء الإجازة الصيفية، وكسبوا ثقة بالنفس وسمعة طيبة في الأوساط الشعبية."}, "g"],
[{en: "11 · The fall of the caliphate", ar: "١١ · إلغاء الخلافة"}, {en: "The group says a wave of atheism and permissiveness swept Egypt after the Kemalist revolution in Turkey and the abolition of the caliphate, and it provoked a strong reaction among Muslims and in al-Banna in particular. He spoke of it to colleagues and to the scholars he could reach, among them Rashid Rida, Sheikh al-Dijwi, Muhammad al-Khidr Husayn, then former Sheikh of al-Azhar, and Muhibb al-Din al-Khatib. He urged positive action, and the efforts led to the founding of the magazine “Al-Fath”.", ar: "تقول الجماعة إن موجة من الإلحاد والإباحية اجتاحت مصر بعد الانقلاب الكمالي في تركيا وإلغاء الخلافة، وكان لها رد فعل قوي عند المسلمين وفي نفس البنا خاصة، فتحدث عن شعوره لزملائه وللعلماء الذين استطاع الاتصال بهم، ومنهم رشيد رضا والشيخ الدجوي ومحمد الخضر حسين شيخ الأزهر السابق ومحب الدين الخطيب. وتحدث معهم في ضرورة مواجهة الموقف بعمل إيجابي، فأثمرت الجهود صدور مجلة «الفتح»."}, "g"],
[{en: "Outside accounts: 1924, the end of the caliphate", ar: "في المصادر الخارجية: 1924 نهاية الخلافة"}, {en: "He learned of the abolition of the Ottoman caliphate in 1924 while still a student. Although the caliphate had no real power, he saw its end as a calamity and later called it a declaration of war against every form of Islam, according to the historian Brian Farmer. Wikipedia notes that afterwards he urged Muslims to prepare for armed struggle against colonial rule.", ar: "علم بإلغاء الخلافة العثمانية عام 1924 وهو ما يزال طالباً. ورغم أن الخلافة لم تكن لها سلطة حقيقية، عدّ نهايتها كارثة، ووصفها لاحقاً بأنها إعلان حرب على كل أشكال الإسلام بحسب المؤرخ برايان فارمر. وتذكر ويكيبيديا أنه دعا بعد ذلك المسلمين إلى الاستعداد للكفاح المسلح ضد الاستعمار."}, "o"],
[{en: "12 · The student’s dream", ar: "١٢ · حلم الطالب"}, {en: "The group says the idea of the Brothers first took shape while he was a Dar al-Ulum student, in an essay titled “What are your hopes in life after you graduate?”. He wrote of a private hope, to make his family happy, and a public one, to be a guiding teacher who spends his days teaching children and his nights teaching their fathers the aim of their religion and the sources of their happiness, by speaking and debate, by writing, and by travelling. The group says his later life never left this plan.", ar: "تقول الجماعة إن فكرة الإخوان تبلورت أول ما تبلورت وهو طالب بدار العلوم، في موضوع إنشائي بعنوان «ما هي آمالك في الحياة بعد أن تتخرج؟». كتب فيه عن أمل خاص هو إسعاد أسرته، وأمل عام هو أن يكون مرشداً معلماً يقضي نهاره في تعليم الأبناء وليله في تعليم الآباء هدف دينهم ومنابع سعادتهم بالخطابة والمحاورة وبالتأليف والكتابة وبالتجول والسياحة. وتقول إن حياته لم تخرج بعد ذلك عن هذا البرنامج."}, "g"],
[{en: "13 · Ismailia, 1927", ar: "١٣ · الإسماعيلية 1927"}, {en: "He received his Dar al-Ulum diploma in 1927, first of his class, and was appointed teacher at the Ismailia state primary school. There he was struck by the military occupation, with British camps along the canal, and the economic occupation, represented by the Suez Canal Company, and was pained to find the town’s Muslims divided by religious disputes. He withdrew from the mosque crowds and returned to the coffeehouse crowds, choosing three large cafés with one weekly lesson each, picking topics that avoided points of dispute and citing the tolerance of early Muslim scholars despite their differences.", ar: "حصل على دبلوم دار العلوم العليا سنة 1927 وكان أول دفعته، وعُيّن معلماً بمدرسة الإسماعيلية الابتدائية الأميرية. وهناك أثّر فيه الاستعمار العسكري الممثل في المعسكرات الإنجليزية بالقناة، والاستعمار الاقتصادي الممثل في شركة قناة السويس، وساءه أن المسلمين في البلد منقسمون بسبب خلافات دينية. فاعتزل جمهور المسجد وعاد إلى جمهور المقاهي، واختار ثلاث مقاهٍ كبيرة ورتب لكل منها درساً في الأسبوع، متحرياً مواضيع لا تتعرض للنواحي الخلافية، وضارباً المثل بتسامح علماء المسلمين الأوائل رغم اختلاف آرائهم."}, "g"],
[{en: "The questions that led to the Brothers", ar: "الأسئلة التي قادت إلى الإخوان"}, {en: "The group says the preaching awakened listeners, who began to ask what they must do for their religion and nation. He gave deliberately open answers, to hold their attention, to wait for the right moment and to prepare restless souls.", ar: "تقول الجماعة إن الوعظ أيقظ المستمعين فأخذوا يسألونه عما يجب عليهم تجاه دينهم وأمتهم، فأجابهم إجابات غير قاطعة جذباً لانتباههم وانتظاراً للفرصة السانحة وتهيئة للنفوس الجامحة."}, "g"],
[{en: "Outside accounts: Ismailia through other eyes", ar: "في المصادر الخارجية: الإسماعيلية بعيون أخرى"}, {en: "Ismailia was the Egyptian headquarters of the Suez Canal Company, with stronger foreign influence than elsewhere. Al-Banna, teaching Arabic at a primary school from 1927, was shocked by the British military camps, the foreign-owned utilities, farms and food supply, and the comfortable villas of the company’s foreign managers beside the simple shacks of Egyptian workers. He preached short talks in the cafés. When some of his views on small points of practice led to sharp disagreements with the local religious establishment, he adopted a policy of avoiding religious controversy. Krämer says he worked as an Arabic primary-school teacher until 1947.", ar: "كانت الإسماعيلية المقر المصري لشركة قناة السويس وفيها نفوذ أجنبي أقوى من غيرها. وقد صدمه، وهو يدرّس اللغة العربية في مدرسة ابتدائية منذ 1927، ما رآه من المعسكرات البريطانية والمرافق والمزارع والتموين المملوكة لأجانب، وفيلات مديري الشركة الأجانب المريحة بجوار أكواخ العمال المصريين البسيطة. وكان يلقي محاضرات قصيرة في المقاهي. ولما أدت بعض آرائه في مسائل فرعية إلى خلافات حادة مع المؤسسة الدينية المحلية تبنى سياسة تجنب الجدل الديني. وتذكر كرامر أنه عمل معلماً للغة العربية في مدرسة ابتدائية حتى 1947."}, "o"],
[{en: "14 · The six men, March 1928", ar: "١٤ · الرجال الستة، مارس 1928"}, {en: "In Dhu al-Qi’da 1347 AH, March 1928, six men who had been moved by his lessons came to see him: Hafez Abdel Hamid, Ahmed al-Hosari, Fouad Ibrahim, Abdel Rahman Hassaballah, Ismail Ezz and Zaki al-Maghrabi. They said they owned only their hot blood, their spirits full of faith and dignity, and a few coins taken from their children’s food, and asked him for the practical road to the glory of Islam and the good of Muslims, wanting to hand him responsibility before Allah. Deeply affected, he replied that they should pledge to Allah to be soldiers for the call of Islam, in which lay the life of the homeland and the dignity of the nation.", ar: "في ذي القعدة 1347هـ، مارس 1928م، زاره ستة رجال تأثروا بدروسه وهم: حافظ عبد الحميد وأحمد الحصري وفؤاد إبراهيم وعبد الرحمن حسب الله وإسماعيل عز وزكي المغربي. قالوا إنهم لا يملكون إلا دماءً حارة وأرواحاً مشرقة بالإيمان والكرامة ودراهم قليلة من قوت أبنائهم، وسألوه عن الطريق العملية إلى عزة الإسلام وخير المسلمين، يريدون أن يحمّلوه المسؤولية بين يدي الله. فرد متأثراً بأن يبايعوا الله على أن يكونوا لدعوة الإسلام جنداً، وفيها حياة الوطن وعزة الأمة."}, "g"],
[{en: "The name", ar: "الاسم"}, {en: "One of them asked what to call themselves: a society, a club, a Sufi order or a union. He answered none of these: leave formalities, and let the foundation be the idea, the spirit and the work. “We are brothers in the service of Islam,” he said, “so we are the Muslim Brothers.” The group says the name came suddenly and became a proverb, and that this was the first formation of the Brotherhood.", ar: "سأل أحدهم بم يسمون أنفسهم: جمعية أم نادياً أم طريقة أم نقابة لتأخذ الشكل الرسمي؟ فأجاب البنا: لا هذا ولا ذاك، دعونا من الشكليات والرسميات، وليكن أساس اجتماعنا الفكرة والمعنويات والعمليات. ثم قال: نحن إخوة في خدمة الإسلام، فنحن إذن «الإخوان المسلمون». وتقول الجماعة إن الاسم جاء بغتة وذهب مثلاً، وإنه أول تشكيل للإخوان."}, "g"],
[{en: "Outside accounts: who the six men were", ar: "في المصادر الخارجية: من كان الرجال الستة"}, {en: "Wikipedia describes six workers affiliated with the Suez Canal Company who complained about injustices suffered by Muslims under foreign control and made him their leader; Britannica says they were six workers from a British camp labour force. Krämer stresses that the co-founders were workers, employees and tradesmen, most employed by foreign companies, not intellectuals. Wikipedia dates his term as General Guide from 22 March 1928.", ar: "تصف ويكيبيديا ستة عمال مرتبطين بشركة قناة السويس اشتكوا من المظالم التي يعانيها المسلمون تحت السيطرة الأجنبية وجعلوه قائدهم، وتقول دائرة المعارف البريطانية إنهم ستة عمال من قوة العمل في معسكر بريطاني. وتؤكد كرامر أن المؤسسين لم يكونوا مثقفين بل عمالاً وموظفين وحرفيين يعمل معظمهم في شركات أجنبية. وتؤرخ ويكيبيديا ولايته مرشداً عاماً بدءاً من 22 مارس 1928."}, "o"],
[{en: "15 · The call spreads", ar: "١٥ · انتشار الدعوة"}, {en: "The group says he worked on in silence while the call won supporters every day, and he visited every village and town he could on his weekly day off and in the summer holidays, nearby places in the first, distant ones in the second. After two years there were branches in Abu Suwayr, Port Said and Al-Balah, after three years another in Suez, and after four years about ten branches, with an institute in Ismailia for educating girls to become Muslim Sisters.", ar: "تقول الجماعة إنه ظل يعمل لدعوته صامتاً فكسبت كل يوم مزيداً من الأنصار، وزار كل قرية وبلدة استطاع الوصول إليها في عطلته الأسبوعية وإجازته الصيفية، القريبة في الأولى والبعيدة في الثانية. وبعد سنتين قامت شعبة في أبو صوير وبورسعيد والبلاح، وبعد ثلاث سنوات شعبة أخرى في السويس، وبعد أربع سنوات نحو عشرة فروع مع معهد بالإسماعيلية لتربية البنات وإعدادهن ليكنّ أخوات مسلمات."}, "g"],
[{en: "The 1930s: mosque, schools, Cairo and a structure", ar: "الثلاثينيات: المسجد والمدارس والقاهرة والهيكل"}, {en: "According to Krämer, in 1931 the Ismailia group opened its own mosque, followed soon by a boys’ school and a girls’ school, run with strict discipline but with modern European educational methods he thought compatible with Islam; its first branches in the eastern Delta sometimes ran textile or carpet workshops. After the headquarters moved to Cairo in 1932 (Britannica says he asked for the transfer) the group grew, and launched a magazine. As a charitable society it was officially barred from politics. Members were organised in three categories and ten ranks with insignia, like a judo club, Krämer writes, with emphasis on physical exercise and a scouting organisation. By the late 1930s Wikipedia says there were branches in every Egyptian province, with cells called ‘families’ (usar) and attached businesses, clinics and schools.", ar: "بحسب كرامر افتتحت جماعة الإسماعيلية عام 1931 مسجدها الخاص تلاه قريباً مدرسة للبنين وأخرى للبنات تُدار بانضباط صارم مع أساليب تربوية أوروبية حديثة رآها متوافقة مع الإسلام؛ وكانت فروعها الأولى في شرق الدلتا تدير أحياناً ورش نسيج أو سجاد. وبعد انتقال المركز العام إلى القاهرة عام 1932 (وتقول دائرة المعارف البريطانية إنه طلب النقل) نمت الجماعة وأصدرت مجلة. وبصفتها جمعية خيرية كانت محظوراً عليها رسمياً العمل السياسي. ونُظّم الأعضاء في ثلاث فئات وعشر رتب لها شارات، كأنها نادي جودو كما تكتب كرامر، مع التركيز على الرياضة وإنشاء كشافة. وبحلول أواخر الثلاثينيات تقول ويكيبيديا إن لها فروعاً في كل محافظة مصرية، وخلايا تسمى «الأسر» وأعمالاً وعيادات ومدارس ملحقة."}, "o"],
[{en: "Institutions, 1933", ar: "المؤسسات عام 1933"}, {en: "The first General Shura Council met on 15 June 1933 and chose the first guidance office. A newspaper was launched as the group’s voice, and the first women’s group (Muslim Sisters) and the first students’ section were formed the same year.", ar: "انعقد أول مجلس شورى عام في 15 يونيو 1933 واختار أول مكتب إرشاد، وصدرت صحيفة تعبّر عن الجماعة، وتشكلت في العام نفسه أول مجموعة للأخوات وأول قسم للطلاب."}, "g"],
[{en: "1936–1939: Palestine", ar: "1936–1939: فلسطين"}, {en: "Among the early achievements historians note was the group’s involvement in the 1936–1939 Arab revolt in Palestine. It ran a fundraising campaign said to rely on rural and urban working-class donations rather than wealthy Egyptians, held special prayers, political rallies and distributed publications, helping to make Palestine a wider Muslim and pan-Arab concern. In 1939 al-Banna revived Rashid Rida’s magazine Al-Manar, which had died with Rida in 1935.", ar: "من إنجازات الجماعة المبكرة التي يذكرها المؤرخون مشاركتها في الثورة العربية في فلسطين 1936–1939. فقد نظمت حملة تبرعات يقال إنها اعتمدت على تبرعات الطبقات العاملة في الريف والمدن لا على الأثرياء المصريين، وأقامت صلوات خاصة ومهرجانات سياسية ووزعت نشرات، مما أسهم في جعل فلسطين شأناً إسلامياً وعربياً أوسع. وفي 1939 أحيا البنا مجلة المنار لرشيد رضا التي ماتت بوفاته عام 1935."}, "o"],
[{en: "The war years: growth, politics and cracks", ar: "سنوات الحرب: النمو والسياسة والتصدعات"}, {en: "By the Second World War the group had grown enormously, drawing students, civil servants, urban workers and others from almost every part of Egyptian society; Krämer estimates several hundred thousand members. Many came to see the government as betraying nationalism. Britannica says he tried for a while to keep a tactical alliance with the authorities. Jadaliyya notes that in 1941 he was transferred to Upper Egypt as a teacher but returned to Cairo within months, and that after prime minister Ahmed Maher was assassinated on 24 February 1945 by a member of the National Party he quickly reassured the new prime minister, al-Nuqrashi, of the group’s sincerity. Allies’ attempts to win parliamentary seats failed, and he himself spoke of running for office although he called for dissolving all parties. Krämer sees cracks appearing as some members openly rebelled against his leadership.", ar: "بحلول الحرب العالمية الثانية نمت الجماعة نمواً هائلاً وجذبت طلاباً وموظفين وعمالاً في المدن وغيرهم من كل شرائح المجتمع المصري تقريباً، وتقدّر كرامر عدد الأعضاء بمئات الآلاف. ورأى كثيرون أن الحكومة تخون الوطنية. وتقول دائرة المعارف البريطانية إنه حاول فترة الإبقاء على تحالف تكتيكي مع السلطة. وتذكر جدلية أنه نُقل عام 1941 معلماً إلى صعيد مصر لكنه عاد إلى القاهرة خلال أشهر، وأنه بعد اغتيال رئيس الوزراء أحمد ماهر في 24 فبراير 1945 على يد عضو في الحزب الوطني سارع إلى طمأنة رئيس الوزراء الجديد النقراشي بصدق الجماعة. وفشلت محاولات حلفائه الفوز بمقاعد برلمانية، وتحدث هو نفسه عن الترشح رغم دعوته إلى حل الأحزاب. وترى كرامر أن التصدعات ظهرت إذ تمرد بعض الأعضاء علناً على قيادته."}, "o"],
[{en: "His ideas, as scholars summarise them", ar: "أفكاره كما يلخصها الباحثون"}, {en: "Oxford reference works summarise his thought as presenting a distinct, all-encompassing modern ideology based on Islam. He saw Islam as a comprehensive system of life with the Quran and Sunnah as the only acceptable constitution, and called for Islamising the state, economy and society. He argued that a just society needed institutions and progressive taxation, with zakat reserved for social spending to reduce inequality. He criticised Western materialism, British imperialism and the traditionalism of Egypt’s ulema. He appealed to Egyptian and pan-Arab patriotism but rejected Arab nationalism, regarding all Muslims as one community. He wanted the state to enforce public morality through censorship and corporal punishment, yet his thought was open to Western ideas and he sometimes quoted European authors.", ar: "تلخص المراجع الموسوعية الأكسفوردية فكره بأنه قدّم أيديولوجيا حديثة متميزة وشاملة قائمة على الإسلام. فقد رأى الإسلام نظام حياة شاملاً دستوره الوحيد المقبول القرآن والسنة، ودعا إلى أسلمة الدولة والاقتصاد والمجتمع. وقال إن المجتمع العادل يحتاج إلى مؤسسات وضرائب تصاعدية، مع تخصيص الزكاة للإنفاق الاجتماعي لتقليل التفاوت. وانتقد المادية الغربية والإمبريالية البريطانية وتقليدية علماء الأزهر. وخاطب الوطنية المصرية والعربية لكنه رفض القومية العربية واعتبر المسلمين جميعاً أمة واحدة. وأراد أن تفرض الدولة الأخلاق العامة بالرقابة والعقوبات البدنية، ومع ذلك كان فكره منفتحاً على الأفكار الغربية وكان أحياناً يقتبس من مؤلفين أوروبيين."}, "o"],
[{en: "His writings on jihad and how they are read", ar: "كتاباته عن الجهاد وكيف تُقرأ"}, {en: "Wikipedia, citing Sadakat Kadri, says that after the caliphate’s abolition he warned against the widespread belief that jihad of the heart matters more than jihad of the sword, and in his tract on jihad from the late 1930s he called preparing for jihad an individual duty for every Muslim, making him, in Kadri’s view, the first influential scholar since the 1857 Indian uprising to do so. The group presents its own approach as peaceful and quotes him separating speech, action and jihad. Krämer finds his policies inconsistent: sometimes he called for jihad and sometimes for prudence, and on corporal punishment he spoke in favour in 1936 and against in 1948.", ar: "تقول ويكيبيديا نقلاً عن ساداكات قادري إنه بعد إلغاء الخلافة حذّر من الاعتقاد الشائع بأن جهاد القلب أهم من جهاد السيف، وإنه في رسالته عن الجهاد في أواخر الثلاثينيات عدّ الاستعداد للجهاد واجباً فردياً على كل مسلم، فكان بحسب قادري أول عالم مؤثر منذ انتفاضة الهند عام 1857 يفعل ذلك. وتقدم الجماعة منهجها بأنه سلمي وتنقل عنه التمييز بين القول والعمل والجهاد. وترى كرامر أن سياساته كانت غير متسقة: فأحياناً دعا إلى الجهاد وأحياناً إلى الحكمة، وفي العقوبات البدنية أيّدها عام 1936 ورفضها عام 1948."}, "o"],
[{en: "The Secret Apparatus", ar: "النظام الخاص"}, {en: "Jadaliyya says that in 1942, after a first clash with the authorities, he decided to set up a secret apparatus of the group’s best fighters, answering directly to the Guide. Wikipedia says he allowed a secret military wing that took part in the Arab–Israeli conflict. Oxford sources describe it as the armed wing that planned and carried out attacks on officials and institutions and add that his control over it was weak: its more militant members refused his agreement with the Egyptian government to merge the Brotherhood militia into the army during the 1948–49 war. After his death his successor, Hassan al-Hudaybi, condemned the violence of 1946–1949 and ordered the secret branch dissolved, which caused deep tension with its supporters.", ar: "تقول جدلية إنه قرر عام 1942، بعد أول صدام مع السلطات، تأسيس نظام سري من خيرة مقاتلي الجماعة يرتبط بالمرشد مباشرة. وتقول ويكيبيديا إنه سمح بقيام جناح عسكري سري شارك في الصراع العربي الإسرائيلي. وتصفه مراجع أكسفورد بأنه الذراع المسلحة التي خططت ونفذت هجمات على مسؤولين ومؤسسات، وتضيف أن سيطرته عليه كانت ضعيفة، فقد رفض أعضاؤه الأكثر تشدداً اتفاقه مع الحكومة المصرية على دمج مليشيا الإخوان في الجيش أثناء حرب 1948–49. وبعد وفاته أدان خليفته حسن الهضيبي عنف 1946–1949 وأمر بحل الجناح السري، مما سبّب توتراً عميقاً مع مؤيديه."}, "o"],
[{en: "1948: the Palestine war and the violence at home", ar: "1948: حرب فلسطين والعنف في الداخل"}, {en: "In 1948 the group sent volunteers to fight in the Arab–Israeli war. Between June and November 1948 a series of bombings hit Jewish quarters of Cairo, and members of the Society were charged in a 1950 trial with carrying out all of them. In November 1948, after several bombings and assassination attempts, police claimed to seize a car with documents and plans of the secret apparatus, the government arrested 32 of its leaders and banned the Brotherhood. Qantara’s reviewer adds that under political pressure the group had by then come to treat Egyptian Jews as enemies in its campaign against what it called the Zionist conspiracy in Palestine.", ar: "في 1948 أرسلت الجماعة متطوعين للقتال في الحرب العربية الإسرائيلية. وبين يونيو ونوفمبر 1948 وقعت سلسلة تفجيرات في أحياء يهودية في القاهرة، واتُّهم أعضاء في الجمعية في محاكمة عام 1950 بتنفيذها كلها. وفي نوفمبر 1948، بعد عدة تفجيرات ومحاولات اغتيال، زعمت الشرطة ضبط سيارة بها وثائق وخطط للنظام الخاص، واعتقلت الحكومة 32 من قياداته وحظرت الإخوان. ويضيف مراجع كتاب كرامر في قنطرة أن الجماعة كانت قد اعتبرت حينها اليهود المصريين أعداءً في حملتها ضد ما سمته المؤامرة الصهيونية في فلسطين تحت ضغط التوتر السياسي."}, "o"],
[{en: "December 1948: dissolution and the killing of the prime minister", ar: "ديسمبر 1948: الحل ومقتل رئيس الوزراء"}, {en: "Prime minister Mahmoud al-Nokrashy Pasha, alarmed by the group’s assertiveness and by rumours of a plot against the monarchy, outlawed it in December 1948, impounded its assets and jailed scores of members. On 28 December 1948 Nokrashy was shot dead in the Ministry of Interior by Abdel Meguid Ahmed Hassan, a student and Brotherhood member dressed as a lieutenant, who fired twice. Sources describe a cycle of retaliation that followed.", ar: "أصدر رئيس الوزراء محمود فهمي النقراشي باشا، قلقاً من جرأة الجماعة ومن شائعات عن مؤامرة على الملكية، قراراً بحلها في ديسمبر 1948 وصادر أموالها وسجن العشرات من أعضائها. وفي 28 ديسمبر 1948 قُتل النقراشي رمياً بالرصاص في وزارة الداخلية على يد عبد المجيد أحمد حسن، وهو طالب وعضو في الإخوان متنكراً في زي ملازم، وأطلق عليه رصاصتين. وتصف المصادر دورة انتقام تلت ذلك."}, "o"],
[{en: "His reaction to the assassination", ar: "موقفه من الاغتيال"}, {en: "Al-Banna issued a statement condemning the killing and saying terror is not acceptable in Islam; one timeline quotes him as saying the killers were neither Brothers nor Muslims. Some encyclopedias say he declared himself innocent; Krämer describes his attitude toward terrorism as ambivalent, and writers disagree about how sincere his denial was.", ar: "أصدر البنا بياناً أدان فيه الاغتيال وقال إن الإرهاب غير مقبول في الإسلام، وينقل أحد الجداول الزمنية عنه قوله إن القتلة ليسوا إخواناً ولا مسلمين. وتقول بعض الموسوعات إنه أعلن براءته، بينما تصف كرامر موقفه من الإرهاب بأنه ملتبس، ويختلف الكتّاب حول مدى صدق نفيه."}, "o"],
[{en: "12 February 1949: how he was killed", ar: "12 فبراير 1949: كيف قُتل"}, {en: "That day al-Banna and his brother-in-law Abdel Karim Mansour were due to negotiate with a government representative, the minister Zaki Ali Pasha, at the headquarters of the Young Men’s Muslim Association in Cairo, but the minister never came. At about five in the afternoon they decided to leave and were waiting for a taxi when two men shot them. Al-Banna died of his wounds, aged 42. He was taken to Qasr El Eyni Hospital, and according to Wikipedia his father later retrieved his body from there and took it home.", ar: "في ذلك اليوم كان البنا وصهره عبد الكريم منصور على موعد للتفاوض مع ممثل للحكومة هو الوزير زكي علي باشا في مقر جمعية الشبان المسلمين بالقاهرة، لكن الوزير لم يحضر. وفي نحو الخامسة مساءً قررا المغادرة وكانا ينتظران سيارة أجرة عندما أطلق عليهما رجلان النار. ومات البنا متأثراً بجراحه وعمره 42 عاماً. نُقل إلى مستشفى القصر العيني، وتذكر ويكيبيديا أن والده استلم جثمانه من هناك وأخذه إلى البيت."}, "o"],
[{en: "The funeral and who was blamed", ar: "الجنازة ومن اتُّهم"}, {en: "According to a report cited by Wikipedia, his coffin was carried by women under police escort, and men were prevented from attending except Makram Ebeid, a government figure. King Farouk and his Iron Guard were accused of being behind the assassination. Encyclopedias say Egypt’s secret police killed him, Oxford sources call it retaliation for Nokrashy’s murder, and Britannica says he was killed with the connivance of the government. A full official investigation that settled the matter is not described in these sources.", ar: "بحسب تقرير تنقله ويكيبيديا حمل النساء نعشه تحت حراسة الشرطة، ومُنع الرجال من الحضور باستثناء مكرم عبيد وهو شخصية حكومية. واتُّهم الملك فاروق وحرسه الحديدي بالوقوف وراء الاغتيال. وتقول الموسوعات إن الشرطة السياسية المصرية قتلته، وتعده مراجع أكسفورد انتقاماً لمقتل النقراشي، وتقول دائرة المعارف البريطانية إنه قُتل بتواطؤ من الحكومة. ولا تصف هذه المصادر تحقيقاً رسمياً كاملاً حسم الأمر."}, "o"],
[{en: "Family", ar: "الأسرة"}, {en: "His daughter Wafa married Said Ramadan, who became a leading Brotherhood figure in the 1950s, and their sons Tariq and Hani Ramadan are Islamic scholars and educators. His younger brother Gamal al-Banna became a more liberal reformist scholar.", ar: "تزوجت ابنته وفاء من سعيد رمضان الذي أصبح من قادة الإخوان في الخمسينيات، وابناهما طارق وهاني رمضان عالمان ومربيان إسلاميان. وصار أخوه الأصغر جمال البنا باحثاً إصلاحياً أكثر ليبرالية."}, "o"],
[{en: "His writings", ar: "كتاباته"}, {en: "He wrote more than two thousand articles and many books and tracts, including the autobiographical Memoirs of the Call and the Preacher (Mudhakkirat al-Da’wa wa al-Da’iya) and collected epistles, some translated in the 1978 volume Five Tracts of Hasan al-Banna by Charles Wendell.", ar: "كتب أكثر من ألفي مقال وكتباً ورسائل كثيرة، منها «مذكرات الدعوة والداعية» ذات الطابع الذاتي ومجموعة رسائله، وبعضها ترجمه تشارلز وندل في كتاب «خمس رسائل لحسن البنا» عام 1978."}, "o"],
[{en: "After his death", ar: "بعد وفاته"}, {en: "The Brotherhood was left in danger of disappearing. Hassan al-Hudaybi was appointed General Guide in 1951, two years after the assassination. The group’s supporters call al-Banna al-Shaheed, the martyr Imam.", ar: "بقيت الجماعة مهددة بالزوال. وعُيّن حسن الهضيبي مرشداً عاماً عام 1951 بعد عامين من الاغتيال. ويسمي أنصار الجماعة البنا الإمام الشهيد."}, "o"],
[{en: "How historians assess him", ar: "كيف يقيّمه المؤرخون"}, {en: "Gudrun Krämer’s 2022 biography, described by a reviewer as the first comprehensive, source-based one, gives a more nuanced picture than earlier, often partisan writing. Supporters stress his social work, anti-colonial activism and organisation-building, and his public condemnation of the prime minister’s murder. Critics stress the secret apparatus, his language of armed jihad and the group’s anti-Jewish campaign in 1948. On fascism, Krämer says he opposed fascist and racial ideologies and Wikipedia cites two of his writings criticising Nazi and Fascist ultra-nationalism, while the writers Malise Ruthven and Paul Berman say he admired Brownshirt methods and borrowed the word ‘phalanges’ from Franco’s Spain, so historians disagree.", ar: "تقدم سيرة غودرون كرامر لعام 2022، التي يصفها أحد المراجعين بأنها أول سيرة شاملة قائمة على المصادر، صورة أكثر دقة مما كُتب سابقاً وكان في الغالب منحازاً. ويؤكد المؤيدون عمله الاجتماعي ونشاطه المناهض للاستعمار وبناءه للتنظيم وإدانته العلنية لمقتل رئيس الوزراء. ويؤكد المنتقدون النظام الخاص ولغة الجهاد المسلح وحملة الجماعة المعادية لليهود عام 1948. وفي مسألة الفاشية تقول كرامر إنه عارض الأيديولوجيات الفاشية والعنصرية وتورد ويكيبيديا نصين له ينتقدان القومية المتطرفة النازية والفاشية، بينما يقول الكاتبان مالايز روثفن وبول بيرمان إنه أعجب بأساليب القمصان البنية واستعار كلمة «الكتائب» من إسبانيا فرانكو، فالمؤرخون مختلفون."}, "o"],
[{en: "16 · How an admirer described him", ar: "١٦ · كيف وصفه أحد محبيه"}, {en: "The biography quotes a follower who had expected a giant of body and found a man closer to short than tall, gentle, simple and ascetic at home, generous at his table despite poverty, more inclined to listen than to speak, silent when talk became quarrelling, and decisive when the matter reached its essence. Addressing crowds, he said, he seemed like an expert physician who treats real life problems in his speech, and then rebukes with the truth, filling his talk with verses of the Quran.", ar: "تنقل السيرة وصف أحد محبيه الذي توقع عملاقاً في جسمه فوجده أقرب إلى القصر منه إلى الطول، وديعاً زاهداً بسيطاً في بيته، فقيراً كريماً على مائدته، أميل إلى الإصغاء منه إلى الكلام، يصمت إذا صار الحديث مراءً، وتكون كلمته الفاصلة إذا بلغ الأمر زبدته. وحين يخاطب الجماهير بدا له كالطبيب الخبير الذي يعالج في حديثه شؤون حياة المستمعين، ثم يشتد عليهم بصيحات الحق، ويرصّع كلامه بآي القرآن."}, "g"],
[{en: "17 · Why opinions about him differ", ar: "١٧ · لماذا تختلف الآراء فيه"}, {en: "The group’s own article admits that views on him conflict widely: some call him a pure Sufi, some a seasoned politician with aims unrelated to Islam, some a domineering lover of power. It rejects all of these, calling him a glowing ember among dead ashes, a radiant spirit that flickered with Islam in a battered nation, and a “renewer of Islam in the twentieth century”.", ar: "تعترف مقالة الجماعة نفسها بأن الآراء فيه تضاربت إلى حد بعيد: فمن قائل هو صوفي صرف، ومن قائل سياسي مخضرم له مآرب لا تمت للإسلام بصلة، ومن قائل متسلط محب للسلطة. وترفض ذلك كله، وتصفه بأنه جمرة تنبض بين الرماد العاجز الميت، وروح باهرة تومض بالإسلام في أمة مهيضة، و«مجدد الإسلام في القرن العشرين»."}, "g"],
[{en: "His title", ar: "لقبه"}, {en: "The group calls him the Founding Imam and lists him as the first of its eight Guides.", ar: "تسميه الجماعة الإمام المؤسس وتعدّه أول مرشدٍ من مرشديها الثمانية."}, "g"],
[{en: "His idea", ar: "فكرته"}, {en: "To build the Muslim individual, then the Muslim home and family, then the Muslim community, leading to an Islamic government that serves that community.", ar: "بناء الفرد المسلم ثم البيت والأسرة المسلمة ثم المجتمع المسلم، وصولاً إلى حكومة إسلامية تخدم هذا المجتمع."}, "g"],
[{en: "Move to Cairo, 1932", ar: "الانتقال إلى القاهرة 1932"}, {en: "In October 1932 he was transferred to teach at Abbas I School in Cairo, and the board in Ismailia made Cairo the group’s general centre.", ar: "في أكتوبر 1932 نُقل للتدريس في مدرسة عباس الأول بالقاهرة، وقرر مجلس الإدارة في الإسماعيلية اعتبار القاهرة المركز العام للجماعة."}, "g"],
[{en: "Social work", ar: "العمل الاجتماعي"}, {en: "The group says it set up companies, charities and medical clinics, wrote to kings, governments and international bodies, and used boycotts and demonstrations against colonial rule. It also cites a thank-you letter from Egypt’s health minister for its work against cholera in 1947, and says its youth went to defend Palestine in 1948.", ar: "تذكر الجماعة أنها أنشأت شركات وجمعيات خيرية وعيادات، وراسلت الملوك والحكومات والهيئات الدولية، واستخدمت المقاطعة والمظاهرات ضد الاستعمار. وتشير إلى رسالة شكر من وزير الصحة المصري على جهودها ضد الكوليرا عام 1947، وتقول إن شبابها ذهبوا للدفاع عن فلسطين عام 1948."}, "g"],
[{en: "What he taught about Islam", ar: "ما علّمه عن الإسلام"}, {en: "Islam, he said, is belief and practice, homeland and citizenship, religion and state, spirituality and effort, the Quran and the sword. He urged people to build the Islamic nation in their hearts first so it would become real on their land.", ar: "الإسلام عنده عقيدة وعمل، ووطن وجنسية، ودين ودولة، وروحانية وجهاد، ومصحف وسيف. ودعا إلى بناء الأمة الإسلامية في القلوب أولاً لتتحقق على الأرض."}, "g"],
[{en: "Words on jihad", ar: "كلمته في الجهاد"}, {en: "The group quotes him separating the field of speech, of action and of jihad, and true jihad from false, and uses this to describe its approach as peaceful and middle-way.", ar: "تنقل الجماعة قوله بالتمييز بين ميدان القول وميدان العمل وميدان الجهاد، وبين الجهاد الحق والجهاد الباطل، وتستند إليه في وصف منهجها بالسلمي والوسطي."}, "g"],
[{en: "On the Prophet", ar: "عن النبي"}, {en: "In a passage the group republishes, he wrote that no writer or manuscript could contain the full greatness of the Prophet Muhammad.", ar: "في نص تعيد الجماعة نشره كتب أن أي كاتب أو مخطوط لا يستطيع أن يحيط بعظمة النبي محمد كاملة."}, "g"],
[{en: "His legacy in the group", ar: "إرثه داخل الجماعة"}, {en: "The acting guide, Salah Abdel Haq, says he joined in 1962 because he was impressed by al-Banna’s thought and has since acted as a custodian of his approach.", ar: "يقول القائم بأعمال المرشد صلاح عبد الحق إنه انضم عام 1962 لإعجابه بفكر البنا، وإنه ظل حارساً لمنهجه."}, "g"],
[{en: "More on the group’s Arabic site", ar: "المزيد في موقع الجماعة العربي"}, {en: "Its Founding Imam portal has sections called Banna in brief, His thought and legacy, Banna and Palestine, What was written about him, and Photos and documents. It also runs series such as Dr. Abdel Karim Zaidan’s explanation of al-Banna’s Twenty Principles, and republishes his educational advice and his writings on Ramadan, night prayer, the Isra and Miraj, and the Hajj.", ar: "تضم بوابة الإمام المؤسس أقساماً بعنوان: البنا في سطور، وفكره وآثاره، والبنا وفلسطين، وما كُتب عنه، وصور ووثائق. وتنشر سلاسل مثل شرح د. عبد الكريم زيدان للأصول العشرين للإمام البنا، وتعيد نشر وصاياه التربوية وكتاباته عن رمضان وقيام الليل والإسراء والمعراج والحج."}, "g"],
[{en: "Remembrance", ar: "الذكرى"}, {en: "The group calls him the martyred Imam. Its site publishes pieces each February in remembrance of his assassination, together with tributes from preachers and thinkers and writings by later Guides such as Omar El-Telmisani about what they learned from him.", ar: "تسميه الجماعة الإمام الشهيد، وينشر موقعها كل فبراير مقالات في ذكرى اغتياله مع شهادات دعاة ومفكرين وكتابات لمرشدين لاحقين مثل عمر التلمساني عما وعوه عنه."}, "g"]]},
own:{t:{en:"In the group\u2019s own words",ar:"الجماعة بلسانها"},src:{en:"Source: the group\u2019s official site (ikhwan.site). This is how the Brotherhood describes itself; it is presented as its own account, not as independent verification.",ar:"المصدر: الموقع الرسمي للجماعة (ikhwan.site). هذا وصف الجماعة لنفسها، ويُعرض بوصفه روايتها وليس تحققاً مستقلاً."},items:[
[{en:"Motto",ar:"الشعار"},{en:"\u201cAllah is our objective; the Prophet is our leader; the Quran is our law; Jihad is our way; dying in the way of Allah is our highest hope.\u201d",ar:"«الله غايتنا، والرسول قدوتنا، والقرآن دستورنا، والجهاد سبيلنا، والموت في سبيل الله أسمى أمانينا»."}],
[{en:"Goals",ar:"الأهداف"},{en:"Political, social and economic reform from a comprehensive Islamic perspective: building the Muslim individual, then the family, society and an Islamic government, step by step.",ar:"إصلاح سياسي واجتماعي واقتصادي من منظور إسلامي شامل: بناء الفرد المسلم ثم الأسرة والمجتمع ثم الحكومة الإسلامية، خطوة خطوة."}],
[{en:"Approach",ar:"المنهج"},{en:"The group calls its approach peaceful and moderate, favouring gradual reform \u201cconstruction, not demolition\u201d, and says it is not hostile to the West or other religions. It calls Islam \u201ca Salafi call, a Sunni way, a Sufi reality, a political body\u201d and more.",ar:"تصف الجماعة منهجها بأنه سلمي ووسطي، يقوم على الإصلاح التدريجي «بناء لا هدم»، وتقول إنها لا تعادي الغرب ولا الأديان. وتصف دعوتها بأنها «دعوة سلفية وطريقة سنية وحقيقة صوفية وهيئة سياسية» وغير ذلك."}],
[{en:"Founding",ar:"التأسيس"},{en:"It says Hassan al-Banna founded it in Ismailia in 1928 with six working men, including a carpenter, a barber and a gardener. The centre moved to Cairo in 1932, and the first General Shura Council met in 1933 together with the first women\u2019s and students\u2019 sections.",ar:"تذكر أن حسن البنا أسسها في الإسماعيلية عام 1928 مع ستة من العمال والحرفيين، منهم نجار وحلاق وبستاني. وانتقل المركز إلى القاهرة عام 1932، وانعقد أول مجلس شورى عام 1933 مع أول قسم للأخوات وللطلاب."}],
[{en:"Funding",ar:"التمويل"},{en:"It says its activities are funded by members\u2019 contributions and community economic projects.",ar:"تقول إن أنشطتها تموَّل من اشتراكات الأعضاء ومشاريع اقتصادية مجتمعية."}],
[{en:"Structure",ar:"الهيكل"},{en:"The General Guide is elected by the General Shura Council, must be at least 40 and a \u201cFull Brother\u201d for 15 years, and serves six years, renewable once. Below him are the General Guidance Office (executive, four-year term), the General Shura Council (legislative), then governorate offices, regions and divisions. Members are ranked as affiliated, intermediate or full brothers.",ar:"ينتخب مجلس الشورى العام المرشد، ويشترط ألا يقل عمره عن 40 عاماً وأن يكون «أخاً عاملاً» 15 عاماً، ومدته ست سنوات تُجدَّد مرة واحدة. وتحته مكتب الإرشاد العام (السلطة التنفيذية، أربع سنوات) ومجلس الشورى العام (السلطة التشريعية)، ثم مكاتب المحافظات فالمناطق فالشعب. ويُصنَّف الأعضاء إلى منتسب ومنتظم وعامل."}],
[{en:"What the group says it believes",ar:"ما تقول الجماعة إنها تؤمن به"},{en:"Islam, in its words, is belief and worship, homeland and nationality, religion and state, spirituality and work, the Quran and the sword. It says those who think Islam covers only devotion are mistaken.",ar:"الإسلام عندها عقيدة وعبادة، ووطن وجنسية، ودين ودولة، وروحانية وعمل، ومصحف وسيف، وتقول إن من يظن أنه يقتصر على الجانب التعبدي مخطئ."}],
[{en:"A comprehensive approach",ar:"منهج شامل"},{en:"It describes itself as a Salafi call, a Sunni way, a Sufi reality, a political body, a sports group, a scientific and cultural association, an economic company and a social idea.",ar:"تصف نفسها بأنها دعوة سلفية وطريقة سنية وحقيقة صوفية وهيئة سياسية وجماعة رياضية ورابطة علمية ثقافية وشركة اقتصادية وفكرة اجتماعية."}],
[{en:"Its reference",ar:"مرجعيتها"},{en:"Its reference is Islam as found in the Quran, the Sunnah and the Sharia.",ar:"مرجعيتها الإسلام كما يتمثل في القرآن والسنة والشريعة."}],
[{en:"Imbuing society with Islam",ar:"صبغ المجتمع بالإسلام"},{en:"It says it works to give the nation a full Islamic character in every aspect of life, educating and reforming every member of society, child, girl, man and woman, within the framework of Sharia.",ar:"تقول إنها تعمل على إضفاء الصبغة الإسلامية الكاملة على كل جوانب الحياة، وتربية وإصلاح كل أفراد المجتمع من طفل وفتاة ورجل وامرأة، في إطار الشريعة."}],
[{en:"Institutions and religious minorities",ar:"المؤسسات وأتباع الأديان"},{en:"It says it believes in comprehensive institutionalisation in which everyone cooperates to protect the country’s prosperity and to protect people of different religious affiliations.",ar:"تقول إنها تؤمن بالعمل المؤسسي الشامل الذي يتعاون فيه الجميع لحماية رخاء البلاد وحماية أتباع الديانات المختلفة."}],
[{en:"Relations with others",ar:"العلاقة بالآخرين"},{en:"It says it is not hostile to peoples, religions, institutions or Western countries, and respects any organisation that works to raise and protect Islam. It says it refuses subordination or imposed dictates and will resist them in politics, diplomacy, media, culture, social, relief and educational fields.",ar:"تقول إنها لا تعادي الشعوب ولا الأديان ولا المؤسسات ولا الدول الغربية، وتحترم كل جهة تعمل لرفعة الإسلام وحمايته. وتقول إنها ترفض التبعية والإملاءات وستقاومها في المجالات السياسية والدبلوماسية والإعلامية والثقافية والاجتماعية والإغاثية والتعليمية."}],
[{en:"Nation and people",ar:"الوطن والشعب"},{en:"It says it is an integral part of its people, believes in the unity of their religious, political and intellectual components, and holds to the people’s rights and national constants. It puts its own nation first, Arab unity second, and the wider Islamic community third.",ar:"تقول إنها جزء لا يتجزأ من شعبها، وتؤمن بوحدة مكوناته الدينية والسياسية والفكرية، وتتمسك بحقوق الشعب وثوابته الوطنية. وتجعل وطنها أولاً ثم الوحدة العربية ثم الأمة الإسلامية."}],
[{en:"Openness, justice and anti-corruption",ar:"الانفتاح والعدل ومحاربة الفساد"},{en:"It says it is open to all, works for the nation’s interest and national security, fights corruption, and seeks freedom and social justice.",ar:"تقول إنها منفتحة على الجميع وتعمل لمصلحة الوطن وأمنه القومي وتحارب الفساد وتسعى للحرية والعدالة الاجتماعية."}],
[{en:"Social repair",ar:"الإصلاح الاجتماعي"},{en:"It says it works to spread Islamic teachings and defend Islam within the law, to address economic crises and social ills, to strengthen moral virtues, to revive the nation’s dignity and to free souls from weakness, despair and vice.",ar:"تقول إنها تعمل على نشر تعاليم الإسلام والدفاع عنه في حدود القانون، ومعالجة الأزمات الاقتصادية والأمراض الاجتماعية، وتقوية الفضائل الأخلاقية، وإحياء كرامة الأمة، وتحرير النفوس من الضعف واليأس والرذيلة."}],
[{en:"Gradual reform",ar:"الإصلاح التدريجي"},{en:"Its approach covers the present and the future and aims at construction rather than demolition, with reform in steps.",ar:"منهجها يشمل الحاضر والمستقبل ويقوم على البناء لا الهدم وعلى الإصلاح خطوة خطوة."}],
[{en:"Against dictatorship, for Muslim unity",ar:"ضد الاستبداد ومن أجل وحدة المسلمين"},{en:"It says it works to free the Islamic homeland, in all its parts, from every dictatorship, to help Muslim minorities everywhere, and to unite Muslims into one nation.",ar:"تقول إنها تعمل على تحرير الوطن الإسلامي بكل أجزائه من كل استبداد، ومساعدة الأقليات المسلمة في كل مكان، وتوحيد المسلمين في أمة واحدة."}],
[{en:"Global cooperation",ar:"التعاون العالمي"},{en:"It says it supports global cooperation under the Sharia that preserves freedoms and human rights, and joins in building a human civilisation on the synergy of faith and matter.",ar:"تقول إنها تدعم التعاون العالمي في ظل الشريعة التي تحفظ الحريات وحقوق الإنسان، وتشارك في بناء حضارة إنسانية تجمع بين الإيمان والمادة."}],
[{en:"Women",ar:"المرأة"},{en:"It says it guarantees women their full rights as approved under Sharia.",ar:"تقول إنها تضمن للمرأة كامل حقوقها كما أقرتها الشريعة."}],
[{en:"Features of its approach",ar:"سمات منهجها"},{en:"It lists: staying away from points of dispute, from the domination of notables, and from parties and organisations; focusing on formation and gradual steps; and preferring productive practice to publicity.",ar:"تعدّد: الابتعاد عن مواطن الخلاف، وعن سيطرة الوجهاء والأعيان، وعن الأحزاب والتنظيمات؛ والتركيز على التكوين والخطوات التدريجية؛ وتفضيل العمل المنتج على الدعاية."}],
[{en:"Peaceful approach",ar:"المنهج السلمي"},{en:"It calls its approach peaceful and moderate, far from every form of violence, and quotes al-Banna distinguishing the field of speech, the field of action, the field of jihad, and true jihad from false jihad.",ar:"تصف منهجها بأنه سلمي ووسطي بعيد عن كل أشكال العنف، وتنقل عن البنا تمييزه بين ميدان القول وميدان العمل وميدان الجهاد وبين الجهاد الحق والجهاد الباطل."}],
[{en:"Government and funding",ar:"الحكم والتمويل"},{en:"It says it considers the constitutional system of government the closest existing system to Islam, and that it funds itself from members’ own pockets and community economic projects.",ar:"تقول إنها ترى النظام الدستوري أقرب نظم الحكم القائمة إلى الإسلام، وإنها تموّل نفسها من جيوب أعضائها ومشروعات اقتصادية مجتمعية."}],
[{en:"Other Islamic groups",ar:"الجماعات الإسلامية الأخرى"},{en:"It says it wishes success to moderate Islamic organisations in their various fields and works to unite around common general goals.",ar:"تقول إنها تتمنى النجاح للمنظمات الإسلامية المعتدلة في مختلف المجالات وتعمل على التوحد حول الأهداف العامة المشتركة."}],
[{en:"Structure: the General Guide",ar:"الهيكل: المرشد العام"},{en:"The Guide is elected by the General Shura Council, must have been a Full Brother for at least 15 years and be at least 40, and may do no other work except scientific or literary work approved by the Guidance Office. He serves six years, renewable once, and appoints one or more deputies. If he dies or cannot serve, his deputy acts until the Shura Council meets to elect a new Guide, and the Council may dismiss a Guide who violates his duties.",ar:"ينتخب مجلس الشورى العام المرشد، ويُشترط أن يكون أخاً عاملاً 15 عاماً على الأقل وألا يقل عمره عن 40 عاماً، ولا يشارك في أي عمل آخر إلا الأعمال العلمية والأدبية بموافقة مكتب الإرشاد. مدته ست سنوات تُجدَّد مرة واحدة، ويختار نائباً أو أكثر. وإذا توفي أو عجز قام نائبه بعمله حتى ينعقد مجلس الشورى لانتخاب مرشد جديد، وللمجلس عزل المرشد إذا أخل بواجباته."}],
[{en:"Structure: General Guidance Office",ar:"الهيكل: مكتب الإرشاد العام"},{en:"The supreme executive leadership. It supervises the progress of the call and directs its policies and management. Members are chosen by secret ballot for four Hijri years, must belong to the General Shura Council and be at least thirty Hijri years old.",ar:"القيادة التنفيذية العليا، تشرف على سير الدعوة وتوجه سياساتها وإدارتها. يُختار أعضاؤه بالاقتراع السري لمدة أربع سنوات هجرية، ويجب أن يكونوا من أعضاء مجلس الشورى العام ولا يقل عمرهم عن ثلاثين سنة هجرية."}],
[{en:"Structure: General Shura Council",ar:"الهيكل: مجلس الشورى العام"},{en:"The legislative authority, whose decisions are binding, with a four Hijri-year term. Members must be Full Brothers who were previously in the Executive Office or their region’s Shura Council, at least thirty Hijri years old, with at least five years in the call and no sentence against them in the past five years.",ar:"السلطة التشريعية وقراراتها ملزمة ومدتها أربع سنوات هجرية. يُشترط في الأعضاء أن يكونوا إخواناً عاملين سبق لهم العضوية في المكتب التنفيذي أو شورى منطقتهم، وألا يقل عمرهم عن ثلاثين سنة هجرية، وأن يكون لهم خمس سنوات في الدعوة على الأقل، ولم يصدر ضدهم حكم في آخر خمس سنوات."}],
[{en:"Structure: offices, regions, divisions",ar:"الهيكل: المكاتب والمناطق والشعب"},{en:"Each governorate has an administrative office with a council, a treasurer and a secretary, which oversees regions. A region contains three to ten divisions and has a centre with an agent, secretary and treasurer. The division is the smallest unit, with a board and a general assembly of the Brothers living there.",ar:"لكل محافظة مكتب إداري له مجلس وأمين صندوق وأمين سر، ويشرف على المناطق. وتضم المنطقة من ثلاث إلى عشر شعب ولها مركز فيه وكيل وأمين سر وأمين صندوق. والشعبة أصغر وحدة، ولها مجلس إدارة وجمعية عمومية تضم الإخوان المقيمين فيها."}],
[{en:"Structure: membership ranks",ar:"الهيكل: درجات العضوية"},{en:"Members are ranked as Affiliated Brothers, Intermediate Brothers and Full Brothers, the last being those whose membership has been approved and fulfilled.",ar:"يُصنَّف الأعضاء إلى إخوان منتسبين ومنتظمين وعاملين، والأخيرون هم من أُقرت عضويتهم واستوفوا شروطها."}]]},
tl:{t:{en:"Timeline, in the group’s account",ar:"التسلسل الزمني برواية الجماعة"},items:[
["1906",{en:"Birth of Hassan al-Banna",ar:"مولد حسن البنا"},{en:"Born in Mahmoudiya, eldest son of a scholar and watchmaker, as the group tells it.",ar:"وُلد في المحمودية الابن الأكبر لعالم وساعاتي بحسب رواية الجماعة."}],
["1927",{en:"Graduates and moves to Ismailia",ar:"التخرج والانتقال إلى الإسماعيلية"},{en:"He finishes first in his class at Dar al-Ulum and becomes a primary-school teacher in Ismailia.",ar:"يتخرج الأول على دفعته في دار العلوم ويعيَّن معلماً في مدرسة ابتدائية بالإسماعيلية."}],
["1928",{en:"Founding in Ismailia",ar:"التأسيس في الإسماعيلية"},{en:"Hassan al-Banna founds the group in Ismailia (1347 AH) with six men, whom the group names and describes as a carpenter, a barber, a launderer, a driver, a gardener and a tyre-shop owner.",ar:"يؤسس حسن البنا الجماعة في الإسماعيلية (1347هـ) مع ستة رجال تسميهم الجماعة وتصفهم بالنجار والحلاق والغسّال والسائق والبستاني وصاحب محل الإطارات."}],
["1932",{en:"General centre moves to Cairo",ar:"المركز العام إلى القاهرة"},{en:"In October al-Banna is transferred to Cairo and the board decides to make Cairo the group’s general centre.",ar:"في أكتوبر يُنقل البنا إلى القاهرة ويقرر مجلس الإدارة جعلها المركز العام للجماعة."}],
["1933",{en:"First Shura Council and new sections",ar:"أول مجلس شورى وأقسام جديدة"},{en:"The first General Shura Council meets on 15 June in Ismailia and chooses the first guidance office. A newspaper is issued, the first Sisters’ group forms on 26 April, and the first students’ section is created.",ar:"ينعقد أول مجلس شورى عام في 15 يونيو بالإسماعيلية ويختار أول مكتب إرشاد. وتصدر صحيفة، وتتشكل أول مجموعة للأخوات في 26 أبريل، ويُنشأ أول قسم للطلاب."}],
["1947",{en:"Cholera epidemic",ar:"وباء الكوليرا"},{en:"The group says Egypt’s health minister wrote to thank it for helping contain the outbreak and for its clinics receiving patients.",ar:"تقول الجماعة إن وزير الصحة المصري كتب إليها شاكراً جهودها في احتواء الوباء واستقبال عياداتها للمرضى."}],
["1948",{en:"The Palestine war",ar:"حرب فلسطين"},{en:"The group says it helped bring the Palestinian cause to public attention and sent its youth to defend Palestine.",ar:"تقول الجماعة إنها أسهمت في التعريف بالقضية الفلسطينية ودفعت بشبابها للدفاع عن فلسطين."}],
["1951",{en:"The Canal War",ar:"معركة القنال"},{en:"The group says it sent its youth to fight the British in the Canal Zone and that many were killed.",ar:"تقول الجماعة إنها أرسلت شبابها لقتال البريطانيين في القناة وإن كثيرين منهم قُتلوا."}],
["1992",{en:"Earthquake relief",ar:"إغاثة الزلزال"},{en:"The group says its relief reached people before the government’s and was praised by international newspapers.",ar:"تقول الجماعة إن إغاثتها وصلت قبل إغاثة الحكومة وإن صحفاً دولية أشادت بدورها."}],
["Later",{en:"The group’s later history, as its sites present it",ar:"تاريخ الجماعة اللاحق كما تعرضه مواقعها"},{en:"The Arabic site keeps special sections titled Morsi as President and files on what it calls the Rabaa massacre. It describes Egypt’s current authorities as a coup government and commemorates detainees it calls martyrs. Dates for these events are not given on the pages I could open, so none are shown.",ar:"يحتفظ الموقع العربي بأقسام خاصة بعنوان مرسي رئيساً وملفات عما يسميه مذبحة رابعة، ويصف السلطات الحالية في مصر بنظام الانقلاب، ويُحيي ذكرى معتقلين يسميهم شهداء. ولا تذكر الصفحات التي استطعت فتحها تواريخ هذه الأحداث، لذلك لم أذكرها."}]]},
ld:{t:{en:"General Guides",ar:"المرشدون العامون"},items:[
[{en:"Founding Imam",ar:"الإمام المؤسس"},"Hasan Al-Banna | حسن البنا",{en:"He urged building the Islamic nation in people’s hearts so it would become real on their land, and called for “knights raising the righteous flags”, which he said the Ummah and the world need.",ar:"دعا إلى بناء الأمة الإسلامية في القلوب لتصبح واقعاً على الأرض، وإلى «فرسان يرفعون الرايات الصالحة» وهو ما قال إن الأمة والعالم يحتاجانه."}],
[{en:"Second Guide",ar:"المرشد الثاني"},"Hasan Al-Hodeiby | حسن الهضيبي",{en:"He advised members to hold to the calling to the last drop of blood and heartbeat, to the promise to Allah and His rope, saying there is no safety except by returning to Allah.",ar:"نصح بالتمسك بالدعوة حتى آخر قطرة دم وآخر نبضة قلب، وبالعهد مع الله وحبله، وقال إنه لا نجاة ولا أمان إلا بالعودة إلى الله."}],
[{en:"Third Guide",ar:"المرشد الثالث"},"Omar El-Telmisani | عمر التلمساني",{en:"He said the group works alongside every building effort that would restore Egypt’s esteemed position among Arab and Islamic nations, especially its leadership.",ar:"قال إن الجماعة تعمل مع كل جهد بنّاء يعيد لمصر مكانتها بين الدول العربية والإسلامية وخاصة قيادتها."}],
[{en:"Fourth Guide",ar:"المرشد الرابع"},"Mohamed Hamed Abou-ElNasr | محمد حامد أبو النصر",{en:"He said the Brothers should not be disturbed by hardships but treat them as an honour, because time is measured by the lives of calls and nations, not of individuals.",ar:"قال إن الإخوان لا ينبغي أن تزعجهم المحن بل يعدونها شرفاً، فالزمن يقاس بأعمار الدعوات والأمم لا بأعمار الأفراد."}],
[{en:"Fifth Guide",ar:"المرشد الخامس"},"Mostafa Mashhour | مصطفى مشهور",{en:"He said affairs are run in the spirit of shura, disagreement is natural, the door is open to every opinion, and the group cannot accept a leader who seeks attention.",ar:"قال إن الأمور تُدار بروح الشورى والاختلاف طبيعي والباب مفتوح لكل رأي، وإن الجماعة لا تقبل قائداً يبحث عن الأضواء."}],
[{en:"Sixth Guide",ar:"المرشد السادس"},"Mohamed Al-Maamon Al-Hodeiby | محمد مأمون الهضيبي",{en:"He urged members to appreciate the message they carry and said he was confident that even the whole world could not belittle the holders of this creed.",ar:"حثّ على تقدير الرسالة التي يحملونها وقال إنه واثق بأن العالم كله لو اجتمع لما استطاع الاستخفاف بحملة هذه العقيدة."}],
[{en:"Seventh Guide",ar:"المرشد السابع"},"Mohammed Mahdi Akef | محمد مهدي عاكف",{en:"He said the Islamic ummah needs unity to regain its sovereignty and respect, citing the Quranic command to hold fast together to the rope of Allah.",ar:"قال إن الأمة الإسلامية تحتاج إلى الوحدة لاستعادة سيادتها واحترامها، مستشهداً بالأمر القرآني بالاعتصام جميعاً بحبل الله."}],
[{en:"Eighth Guide",ar:"المرشد الثامن"},"Mohammed Badie | محمد بديع",{en:"The site shows no quotation beside his name.",ar:"لا يعرض الموقع اقتباساً بجانب اسمه."}],
[{en:"Acting General Guide (per ikhwan.site)",ar:"القائم بأعمال المرشد (بحسب ikhwan.site)"},"Dr. Salah Abdel Haq | د. صلاح عبد الحق",{en:"According to ikhwan.site: born in Cairo on 1 October 1945 and joined in 1962. Arrested in 1965, he says he denied any armed activity and was held about nine years, until 1974. He graduated in medicine from Ain Shams University in 1976 and worked as a dermatologist, including in Saudi Arabia from 1985. He headed the International Islamic Forum for Education for over fifteen years and sat on the General Shura Council. The Shura Council elected him acting guide after Ibrahim Munir, with his priorities given as redefining the group, enhancing its status and reunifying it, handling the detainees issue, and empowering youth.",ar:"بحسب ikhwan.site: وُلد في القاهرة في 1 أكتوبر 1945 وانضم عام 1962. اعتُقل عام 1965 ويقول إنه أنكر أي نشاط مسلح وظل محتجزاً نحو تسع سنوات حتى 1974. تخرج في كلية الطب بجامعة عين شمس عام 1976 وعمل طبيب جلدية، ومنذ 1985 في السعودية. ترأس المنتدى الإسلامي الدولي للتربية أكثر من خمس عشرة سنة، وكان عضواً في مجلس الشورى العام. انتخبه مجلس الشورى قائماً بأعمال المرشد خلفاً لإبراهيم منير، وتحددت أولوياته في إعادة تعريف الجماعة وتعزيز مكانتها وتوحيدها، ومعالجة ملف المعتقلين، وتمكين الشباب."}],
[{en:"Acting General Guide (per ikhwanonline.com)",ar:"القائم بأعمال المرشد (بحسب ikhwanonline.com)"},"Dr. Mahmoud Hussein | د. محمود حسين",{en:"The group’s Arabic site, ikhwanonline.com, names Dr. Mahmoud Hussein as acting General Guide and features videos of him in that role, including a podcast interview on the group and the changes in Egypt and the region, a special interview on the anniversary of the founding, a programme on the group’s present and future, and a speech. The group’s two official sites therefore name different acting guides, and this site shows both as each presents it.",ar:"يسمّي موقع الجماعة العربي ikhwanonline.com الدكتور محمود حسين قائماً بأعمال المرشد العام، ويعرض فيديوهات له بهذه الصفة، منها حلقة بودكاست عن الجماعة والتغيرات في مصر والمنطقة، ولقاء خاصاً في ذكرى التأسيس، وحلقة عن واقع الجماعة ومستقبلها، وكلمة. فالموقعان الرسميان للجماعة يسميان مرشدين بالإنابة مختلفين، ويعرض هذا الموقع الاثنين كما يقدمهما كل منهما."}]]},
salah:{t:{en:"Dr. Salah Abdel Haq",ar:"د. صلاح عبد الحق"},items:[
[{en:"Born and raised",ar:"النشأة"},{en:"Born on 1 October 1945 as the middle of three children (the site says between two siblings), he grew up in Heliopolis, east of Cairo, where his father worked as an inspector of English for the Ministry of Education. The family belonged to the Heliopolis Sporting Club, and he first heard of the Brotherhood in 1957 from the imam of the club’s mosque.",ar:"وُلد في 1 أكتوبر 1945 وهو الأوسط بين شقيقين بحسب الموقع، ونشأ في مصر الجديدة شرق القاهرة حيث كان والده مفتشاً للغة الإنجليزية في وزارة التربية. وكانت الأسرة من أعضاء نادي هليوبوليس الرياضي، وسمع عن الإخوان لأول مرة عام 1957 من إمام مسجد النادي."}],
[{en:"Joining the group",ar:"الانضمام للجماعة"},{en:"He came to know the Brotherhood at high-school age through Syrian students who came to Cairo after the 1958 Egypt–Syria union, and joined its ranks in 1962, impressed by Imam al-Banna’s thought.",ar:"تعرف على الإخوان في سن الثانوية عن طريق طلاب سوريين جاؤوا إلى القاهرة بعد الوحدة بين مصر وسوريا عام 1958، وانضم إلى صفوفها عام 1962 متأثراً بفكر الإمام البنا."}],
[{en:"Detention",ar:"الاعتقال"},{en:"He was arrested in 1965 in his third year of medical school, along with his two brothers, and sent to a military prison. He says he was tortured to force him to confess to taking up arms, which he denied entirely, yet he stayed in prison about nine years, until 1974, alongside Dr Mohamed Badie and Dr Mahmoud Ezzat.",ar:"اعتُقل عام 1965 وهو في السنة الثالثة بكلية الطب مع شقيقيه وأُودعوا السجن الحربي. يقول إنه تعرض لتعذيب شديد لحمله على الاعتراف بحمل السلاح وهو ما أنكره تماماً، ومع ذلك بقي في السجن نحو تسع سنوات حتى 1974، ورافق فيه د. محمد بديع ود. محمود عزت."}],
[{en:"Studies and career",ar:"الدراسة والعمل"},{en:"He entered the Faculty of Medicine at Ain Shams University in 1962, kept studying his syllabus in prison, sat his exams right after release in 1974, graduated in December 1976 and interned in 1977. He earned a master’s degree in dermatology in 1982 and worked as a dermatologist.",ar:"التحق بكلية الطب جامعة عين شمس عام 1962، وواصل مذاكرة مقرراته في السجن، وأدى امتحاناته بعد الإفراج مباشرة عام 1974، وتخرج في ديسمبر 1976 وقضى سنة الامتياز عام 1977، ونال الماجستير في الأمراض الجلدية عام 1982 وعمل طبيب جلدية."}],
[{en:"Saudi Arabia and family",ar:"السعودية والأسرة"},{en:"In 1985 he moved to Saudi Arabia to work as a dermatologist, living among scholars and preachers. He married the daughter of Dr Abd al-Rahman Raafat al-Basha, a scholar of literature and criticism and a founder of Imam Mohammad Ibn Saud Islamic University.",ar:"سافر عام 1985 إلى السعودية للعمل طبيب جلدية وعاش بين العلماء والدعاة. وتزوج من ابنة د. عبد الرحمن رأفت الباشا، العالم والأديب والناقد وأحد مؤسسي جامعة الإمام محمد بن سعود الإسلامية."}],
[{en:"Role in the group",ar:"دوره في الجماعة"},{en:"He is known for educational work within the group as a lecturer and teacher, active among student circles in Egyptian universities in the 1970s, and headed the International Islamic Forum for Education for more than fifteen consecutive years. He was a member of the General Shura Council and representative of the group’s overseas liaison office under acting guide Ibrahim Munir.",ar:"اشتهر بالنشاط التربوي داخل الجماعة محاضراً ومعلماً، ونشط بين الطلاب في الجامعات المصرية في السبعينيات، وترأس المنتدى الإسلامي الدولي للتربية أكثر من خمس عشرة سنة متتالية. وكان عضواً في مجلس الشورى العام وممثلاً لرابطة الإخوان بالخارج في عهد القائم بأعمال المرشد إبراهيم منير."}],
[{en:"Personal traits",ar:"السمات الشخصية"},{en:"The site describes him as calm, shunning the spotlight, a good listener, firm in his positions, with strong argument and accurate citation of the Quran, the Sunnah and the literature of the Islamic call.",ar:"يصفه الموقع بأنه هادئ يبتعد عن الأضواء، حسن الاستماع، ثابت المواقف، قوي الحجة، دقيق الاستشهاد بالقرآن والسنة وأدبيات الدعوة."}],
[{en:"Becoming acting guide",ar:"تولي القيادة بالإنابة"},{en:"The Shura Council elected him acting General Guide to succeed Ibrahim Munir, after which the International Shura Council gave unanimous support. His stated priorities are redefining the group, enhancing its status and reunifying it, actively handling the detainees’ issue and their families, and empowering youth to manage the coming stage. Note that ikhwanonline.com names a different acting guide, Dr Mahmoud Hussein.",ar:"انتخبه مجلس الشورى قائماً بأعمال المرشد العام خلفاً لإبراهيم منير، ثم حظي بدعم بالإجماع من مجلس الشورى الدولي. وأولوياته المعلنة إعادة تعريف الجماعة وتعزيز مكانتها وتوحيدها، وإدارة ملف المعتقلين وأسرهم بفاعلية، وتمكين الشباب لإدارة المرحلة المقبلة. ويُلاحظ أن موقع ikhwanonline.com يسمّي قائماً بأعمال مختلفاً هو د. محمود حسين."}]]},
