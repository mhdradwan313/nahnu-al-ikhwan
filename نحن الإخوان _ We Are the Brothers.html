killed:{"t": {en: "Killed by Israel", ar: "قُتلوا على يد إسرائيل"}, "src": {en: "Source: only the Tech for Palestine “Palestine Datasets” site (data.techforpalestine.org), which republishes figures from Gaza’s Ministry of Health. Figures are as of 7 October 2026 for the daily totals, and the names list covers 7 October 2023 to 7 May 2026.", ar: "المصدر: موقع «مجموعات بيانات فلسطين» التابع لـ«تك فور فلسطين» (data.techforpalestine.org) فقط، وهو ينشر أرقام وزارة الصحة في غزة. الأرقام حتى 7 أكتوبر 2026 للإجماليات اليومية، وتغطي قائمة الأسماء المدة من 7 أكتوبر 2023 إلى 7 مايو 2026."}, "lead": {en: "Behind every number is a person. The list at the source names 72,835 people known to have been killed in Gaza since 7 October 2023, each with a name, a sex and, where known, a date of birth.", ar: "وراء كل رقم إنسان. تضم القائمة في المصدر أسماء 72,835 شخصاً عُرف أنهم قُتلوا في غزة منذ 7 أكتوبر 2023، لكل منهم اسم وجنس وتاريخ ميلاد حيثما عُرف."}, "sh": {en: "Latest daily totals", ar: "آخر الإجماليات اليومية"}, "ch": {en: "Who is on the names list", ar: "من هم في قائمة الأسماء"}, "cn": {en: "72,835 names. Boys and girls together are 21,637, about 30 percent of the list.", ar: "72,835 اسماً. الأولاد والبنات معاً 21,637، أي نحو 30% من القائمة."}, "mh": {en: "How the data is collected, and its limits", ar: "كيف تُجمع البيانات وحدودها"}, "lh": {en: "Read the source", ar: "اقرأ المصدر"}, "stats": [[74250, {en: "People killed in Gaza (daily report total)", ar: "إجمالي من قُتلوا في غزة (التقرير اليومي)"}], [20179, {en: "Children", ar: "الأطفال"}], [12500, {en: "Women", ar: "النساء"}], [1701, {en: "Medical personnel", ar: "الكوادر الطبية"}], [262, {en: "Journalists", ar: "الصحفيون"}], [140, {en: "Civil defence staff", ar: "عناصر الدفاع المدني"}], [175278, {en: "People injured", ar: "الجرحى"}]], "comp": [[36067, {en: "Men (18 to 64)", ar: "رجال (18 إلى 64)"}], [12803, {en: "Boys (under 18)", ar: "أولاد (دون 18)"}], [11733, {en: "Women (18 to 64)", ar: "نساء (18 إلى 64)"}], [8834, {en: "Girls (under 18)", ar: "بنات (دون 18)"}], [2089, {en: "Senior men (65+)", ar: "رجال مسنون (65+)"}], [1309, {en: "Senior women (65+)", ar: "نساء مسنات (65+)"}]], "rows": [[{en: "Where the names come from", ar: "من أين تأتي الأسماء"}, {en: "The names list is derived from lists issued by Gaza’s Ministry of Health, usually as PDF files through its Telegram channel, and Tech for Palestine updates it whenever a new list is released. Each record has the person’s original Arabic name, an English translation of the name, birth date, sex, and an ID number where one exists.", ar: "قائمة الأسماء مشتقة من قوائم تصدرها وزارة الصحة في غزة، عادة بصيغة PDF عبر قناتها على تلغرام، وتحدّثها «تك فور فلسطين» كلما صدرت قائمة جديدة. وفي كل سجل الاسم العربي الأصلي وترجمته الإنجليزية وتاريخ الميلاد والجنس ورقم الهوية حيثما وُجد."}], [{en: "What the list leaves out", ar: "ما تغفله القائمة"}, {en: "In its first update in January 2024 the Ministry said the list did not count: people missing or trapped under rubble; unidentified people who reached hospitals; unidentified bodies handed over by Israel; and people buried by their families without passing through hospitals. It also said victims in Gaza and North Gaza were not counted after its information system stopped in November, although the list was later updated. The dataset states plainly that the list is an undercount.", ar: "قالت الوزارة في أول تحديث لها في يناير 2024 إن القائمة لم تحتسب: المفقودين أو المحتجزين تحت الأنقاض، ومجهولي الهوية الذين وصلوا إلى المستشفيات، والجثامين مجهولة الهوية التي سلّمها الاحتلال، ومن دفنتهم عائلاتهم دون المرور بالمستشفيات. وقالت أيضاً إن ضحايا غزة وشمال غزة لم يُحتسبوا بعد توقف نظامها المعلوماتي في نوفمبر، ثم حُدّثت القائمة لاحقاً. وتنص المجموعة صراحة على أن القائمة أقل من الحقيقة."}], [{en: "Why two totals differ", ar: "لماذا يختلف رقمان"}, {en: "The daily report total (74,250) is larger than the number of names (72,835) because the daily numbers include people who have not been identified.", ar: "إجمالي التقرير اليومي (74,250) أكبر من عدد الأسماء (72,835) لأن الأرقام اليومية تشمل أشخاصاً لم تُحدَّد هوياتهم."}], [{en: "List releases", ar: "إصدارات القائمة"}, {en: "The dataset incorporates Ministry lists dated January 2024, March 2024 (adding names submitted by families), April 2024, June 2024, August 2024, March 2025, June 2025, 15 July 2025 and 31 July 2025, and a May 2026 update, published on 27 July 2026, covering the period up to 7 May 2026.", ar: "تضم المجموعة قوائم الوزارة المؤرخة يناير 2024 ومارس 2024 (مع أسماء قدمتها العائلات) وأبريل 2024 ويونيو 2024 وأغسطس 2024 ومارس 2025 ويونيو 2025 و15 يوليو 2025 و31 يوليو 2025، وتحديث مايو 2026 الذي نُشر في 27 يوليو 2026 ويغطي الفترة حتى 7 مايو 2026."}], [{en: "What the numbers do not capture", ar: "ما لا تلتقطه الأرقام"}, {en: "The dataset’s own context note says the official figures only count deaths that can be identified and linked to an Israeli attack. They do not include people who never reached health authorities or who are long missing, nor deaths from malnutrition, infectious disease, maternal and newborn health problems, untreated conditions, and unrecovered bodies. It says more than 60 percent of Gaza’s buildings are damaged or destroyed.", ar: "تقول مذكرة السياق في المجموعة نفسها إن الأرقام الرسمية لا تحصي إلا الوفيات التي يمكن تحديد هويتها وربطها بهجوم إسرائيلي، ولا تشمل من لم يصلوا إلى الجهات الصحية أو المفقودين منذ زمن، ولا الوفيات الناتجة عن سوء التغذية والأمراض المعدية ومشكلات صحة الأمهات والمواليد والحالات غير المعالجة والجثامين التي لم تُنتشل. وتقول إن أكثر من 60% من مباني غزة تضررت أو دُمّرت."}], [{en: "Estimates the dataset’s authors cite", ar: "تقديرات يوردها مؤلفو المجموعة"}, {en: "To give a fuller picture they cite researchers: a Lancet letter estimating that up to 186,000 or even more deaths could be attributable to the war, and an appendix to an October 2024 letter from medical professionals estimating that around 62,413 people died of starvation and its complications between October 2023 and September 2024. They add that most such deaths would not appear in the daily reports or the names list. These are estimates and are not part of the official count.", ar: "لتقديم صورة أوسع يستشهدون بباحثين: رسالة في مجلة لانسيت تقدّر أن ما يصل إلى 186 ألف وفاة أو أكثر قد يُعزى إلى الحرب، وملحق رسالة من مهنيين طبيين في أكتوبر 2024 يقدّر أن نحو 62,413 شخصاً ماتوا بسبب الجوع ومضاعفاته بين أكتوبر 2023 وسبتمبر 2024. ويضيفون أن معظم هذه الوفيات لن تظهر في التقارير اليومية ولا في قائمة الأسماء. وهذه تقديرات وليست جزءاً من الإحصاء الرسمي."}], [{en: "Israel’s estimate noted on the same page", ar: "تقدير إسرائيل الوارد في الصفحة نفسها"}, {en: "In the same note the authors mention Israel’s own estimate, as of October 2024, that at least 17,000 of the reported dead were Hamas fighters.", ar: "يذكر المؤلفون في المذكرة نفسها تقدير إسرائيل، حتى أكتوبر 2024، بأن 17 ألفاً على الأقل من القتلى المعلنين كانوا مقاتلين في حماس."}], [{en: "How to read this page", ar: "كيف تقرأ هذه الصفحة"}, {en: "The figures above are reproduced as published by Tech for Palestine from Gaza’s health authorities. This site has not independently verified them. The numbers change as new reports are released, so check the source for the latest.", ar: "الأرقام أعلاه منقولة كما تنشرها «تك فور فلسطين» عن الجهات الصحية في غزة. ولم يتحقق هذا الموقع منها بشكل مستقل. وتتغير الأرقام مع صدور تقارير جديدة، فراجع المصدر لمعرفة الأحدث."}]], "links": [[{en: "Names viewer: the full list of names", ar: "عارض الأسماء: القائمة الكاملة"}, "https://data.techforpalestine.org/list/"], [{en: "About the Killed in Gaza dataset", ar: "عن مجموعة بيانات القتلى في غزة"}, "https://data.techforpalestine.org/docs/killed-in-gaza/"], [{en: "Context on Gaza reporting", ar: "سياق التقارير عن غزة"}, "https://data.techforpalestine.org/updates/gaza-ministry-casualty-context/"], [{en: "Journalists killed in Gaza (dataset)", ar: "الصحفيون الذين قُتلوا في غزة (مجموعة بيانات)"}, "https://data.techforpalestine.org/docs/press-killed-in-gaza/"], [{en: "Download the data (CSV)", ar: "تنزيل البيانات (CSV)"}, "https://data.techforpalestine.org/api/v3/killed-in-gaza.csv"]]},

let L='en';try{L=localStorage.getItem('l')||'en'}catch(e){}
const t=o=>o[L]||o.en;
const row=(k,v,c)=>`<div class="row ${c||''}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const nm=x=>typeof x=='string'?x:t(x);
let NF='all',qi=0,sc=0,done=false,P='home';
const V=['home','about','own','banna','timeline','leaders','salah','news','killed','lib','quiz'];
function render(){
 document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';
 document.title=D.brand.ar+' | '+D.brand.en;
 bn.textContent=t(D.brand);lb.textContent=L=='en'?'العربية':'English';
 nav.innerHTML=[['home',{en:'Home',ar:'الرئيسية'}]].concat(D.nav).map(n=>`<a href="#${n[0]}" class="${n[0]==P?'on':''}">${t(n[1])}</a>`).join('');
 const ph=(ti,d)=>`<div class="ph"><h1>${ti}</h1>${d?`<p>${d}</p>`:''}</div>`;
 const S={
 about:ph(t(D.about.t),t(D.desc.about))+`<div class="prose">${D.about.p.map(p=>`<p>${t(p)}</p>`).join('')}</div>`,
 own:ph(t(D.own.t),t(D.desc.own))+`<div class="note">${t(D.own.src)}</div>`+D.own.items.map(i=>row(t(i[0]),t(i[1]))).join(''),
 timeline:ph(t(D.tl.t),t(D.desc.timeline))+D.tl.items.map(i=>row(i[0].replace(/b$/,''),`<h3>${t(i[1])}</h3>${t(i[2])}`,'tlr')).join(''),
 leaders:ph(t(D.ld.t),t(D.desc.leaders))+D.ld.items.map(i=>row(t(i[0]),`<h3>${i[1]}</h3>${t(i[2])}`)).join('')+row(L=='ar'?'اختيار المرشد':'How a Guide is chosen',t(D.guideRule))+`<h2 class="sub">${t(D.other.t)}</h2>`+D.other.items.map(i=>row('',`<h3>${i[0]}</h3>${t(i[1])}`)).join(''),
 news:ph(t(D.news.t),t(D.desc.news))+`<div class="note">${t(D.news.upd)}</div>`+D.news.items.filter(n=>NF=='all'||n[0]==NF).map(n=>row(n[1],`<h3>${t(n[2])}</h3>${t(n[3])}<br><a href="${n[4]}" target="_blank" rel="noopener">${t(D.news.read)}: ${n[5]}</a>`)).join('')+`<h2 class=\"sub\">${t(D.news.wt)}</h2>`+D.news.weekly.map(w=>row('',`<a href=\"${w[1]}\" target=\"_blank\" rel=\"noopener\">${t(w[0])}</a>`)).join(''),
 banna:ph(t(D.banna.t),t(D.desc.banna))+`<div class="note">${t(D.banna.src)}</div>`+D.banna.items.map(i=>row(t(i[0]),`<span class="tag">${t(D.tags[i[2]||'g'])}</span><br>${t(i[1])}`)).join(''),
 salah:ph(t(D.salah.t),t(D.desc.salah))+D.salah.items.map(i=>row(t(i[0]),t(i[1]))).join(''),
 lib:ph(t(D.lib.t),t(D.lib.intro))+D.lib.groups.map(g=>`<h2 class="sub">${t(g[0])}</h2>`+g[1].map(x=>row(`<a href="${x[1]}" target="_blank" rel="noopener">${t(x[0])}</a>`,t(x[2]))).join('')).join(''),
 killed:ph(t(D.killed.t),t(D.desc.killed))+`<div class="note">${t(D.killed.src)}</div><p class="lead">${t(D.killed.lead)}</p><h2 class="sub">${t(D.killed.sh)}</h2><div class="stats">${D.killed.stats.map(x=>`<div class="stat"><b>${x[0].toLocaleString('en-US')}</b><span>${t(x[1])}</span></div>`).join('')}</div><h2 class="sub">${t(D.killed.ch)}</h2><p>${t(D.killed.cn)}</p><div class="cbars">${D.killed.comp.map(x=>`<div class="cb"><div class="cl">${t(x[1])}</div><div class="ct"><i style="width:${(x[0]/36067*100).toFixed(1)}%"></i></div><div class="cv">${x[0].toLocaleString('en-US')}</div></div>`).join('')}</div><h2 class="sub">${t(D.killed.mh)}</h2>`+D.killed.rows.map(i=>row(t(i[0]),t(i[1]))).join('')+`<h2 class="sub">${t(D.killed.lh)}</h2>`+D.killed.links.map(l=>row('',`<a href="${l[1]}" target="_blank" rel="noopener">${t(l[0])}</a>`)).join(''),
 quiz:ph(t(D.quiz.t),t(D.desc.quiz))+'<div class="q" id="qb"></div>'};
 app.innerHTML=P=='home'?`<div class="hero"><div><h1>${t(D.brand)}</h1><p>${t(D.sub)}</p><a class="btn" href="#timeline">${L=='ar'?'ابدأ من التسلسل الزمني':'Start with the timeline'}</a> <a class="btn" style="background:var(--ink)" href="#quiz">${t(D.start)}</a></div><div class="em"><svg><use href="#logo"/></svg></div></div><h2 class="sub">${L=='ar'?'محطات كبرى':'Key moments'}</h2><div class="strip">${[['1906',{en:'Al-Banna is born',ar:'مولد البنا'}],['1928',{en:'Founded in Ismailia',ar:'التأسيس في الإسماعيلية'}],['1932',{en:'Centre moves to Cairo',ar:'المركز إلى القاهرة'}],['1933',{en:'First Shura Council',ar:'أول مجلس شورى'}],['1947',{en:'Cholera relief',ar:'مكافحة الكوليرا'}],['1948',{en:'Palestine war',ar:'حرب فلسطين'}],['1951',{en:'Canal War',ar:'معركة القنال'}]].map(e=>`<a href="#timeline"><b>${e[0]}</b><span>${t(e[1])}</span></a>`).join('')}</div><h2 class="sub">${t(D.homeT)}</h2>`+D.nav.map(n=>`<a class="row" href="#${n[0]}"><div class="k">${t(n[1])}</div><div class="v">${t(D.desc[n[0]])}</div></a>`).join(''):S[P];
 ft.innerHTML='<b>'+t(D.made)+' Shahad Hamas</b><br><a class="ig" href="https://www.instagram.com/shahad_hamas" target="_blank" rel="noopener">'+t(D.follow)+' @shahad_hamas</a><br>'+t(D.brand)+' \u00a9 2026 \u2014 '+t(D.note);
 if(P=='news')document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{NF=c.dataset.k;render()});
 quiz();
}
function quiz(){
 const b=document.getElementById('qb');if(!b)return;
 if(done){b.innerHTML=`<div class="score">${sc} / ${D.Q.length}</div><div class="bar"><i style="width:${sc/D.Q.length*100}%"></i></div><button class="btn" id="rs">${t(D.quiz.again)}</button>`;rs.onclick=()=>{qi=0;sc=0;done=false;quiz()};return}
 const q=D.Q[qi];
 b.innerHTML=`<div class="bar"><i style="width:${qi/D.Q.length*100}%"></i></div><div class="qt">${qi+1}/${D.Q.length}. ${t(q[0])}</div>${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${t(o)}</button>`).join('')}<div id="nx"></div>`;
 b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{
  if(+x.dataset.i==q[2])sc++;
  b.querySelectorAll('.opt').forEach((y,j)=>{y.disabled=true;if(j==q[2])y.classList.add('ok');else if(y==x)y.classList.add('no')});
  nx.innerHTML=`<button class="btn" id="nb">${t(D.quiz.next)}</button>`;
  nb.onclick=()=>{qi++;if(qi>=D.Q.length)done=true;quiz()};
 });
}
lb.onclick=()=>{L=L=='en'?'ar':'en';try{localStorage.setItem('l',L)}catch(e){}render()};
function route(){const x=location.hash.slice(1);const n=V.includes(x)?x:'home';if(n!=P)window.scrollTo(0,0);P=n;render()}
window.addEventListener('hashchange',route);route();

(function(){const it=document.getElementById('intro');if(!it)return;
let seen=false;try{seen=sessionStorage.getItem('intro')==='1'}catch(e){}
if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches){it.remove();return}
document.body.classList.add('introing');
const done=()=>{document.body.classList.remove('introing');it.remove();try{sessionStorage.setItem('intro','1')}catch(e){}};
const tm=setTimeout(done,4600);
document.getElementById('skip').onclick=()=>{clearTimeout(tm);it.style.transition='opacity .4s';it.style.animation='none';it.style.opacity='0';setTimeout(done,400)};
})();
</script>
</body>
</html>
